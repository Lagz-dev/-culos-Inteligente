<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4F0">
<title>B.E.A · Assistente de Visão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  :root {
    color-scheme: light;
    --color-lavender: #BFBBDD;
    --color-lavender-deep: #777392;
    --color-lavender-soft: #F0EFF6;
    --color-peach: #F3BB84;
    --color-peach-deep: #85552F;
    --color-peach-vivid: #E77F32;
    --color-peach-soft: #FFF1E2;
    --color-cream: #F7F4F0;
    --color-surface: #FFFEFC;
    --color-ink: #373544;
    --color-muted: #716F7A;
    --color-line: #E7E2DC;
    --color-camera: #292833;
    --color-overlay: #FFFEFC;
    --color-overlay-border: rgba(255, 254, 252, .82);
    --color-overlay-border-soft: rgba(255, 254, 252, .35);
    --color-overlay-glass: rgba(255, 254, 252, .94);
    --color-camera-glass: rgba(41, 40, 51, .72);
    --color-lavender-hover: #C9C6E2;
    --color-error: #A44750;
    --color-error-soft: #F8E9E9;
    --shadow-panel: 0 18px 55px rgba(55, 53, 68, .07);
    --shadow-camera: 0 8px 24px rgba(55, 53, 68, .08);
    --shadow-scan: 0 0 12px rgba(243, 187, 132, .7);
    --shadow-lavender: 0 4px 0 rgba(119, 115, 146, .18);
    --shadow-lavender-hover: 0 6px 12px rgba(119, 115, 146, .16);
    --accent: var(--color-lavender-deep);
  }

  body[data-state="off"],
  body[data-state="muted"] { --accent: var(--color-lavender-deep); }
  body[data-state="listening"],
  body[data-state="thinking"] { --accent: var(--color-lavender-deep); }
  body[data-state="reconnecting"],
  body[data-state="speaking"] { --accent: var(--color-peach-deep); }
  body[data-state="error"] { --accent: var(--color-error); }

  body {
    background: var(--color-cream);
    color: var(--color-ink);
    font-family: 'Nunito Sans', 'Trebuchet MS', system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    transition: background-color .3s ease, color .3s ease;
  }
  body[data-assistant-mode="jarvis"] {
    color-scheme: dark;
    --color-lavender: #2479D8;
    --color-lavender-deep: #22B8E8;
    --color-lavender-soft: rgba(34, 184, 232, .12);
    --color-peach: #38C9ED;
    --color-peach-deep: #91E9F8;
    --color-peach-vivid: #40CFF2;
    --color-peach-soft: rgba(34, 184, 232, .12);
    --color-cream: #0A1520;
    --color-surface: rgba(15, 29, 42, .94);
    --color-ink: #E8F5FC;
    --color-muted: #A8BFCE;
    --color-line: rgba(112, 190, 224, .2);
    --color-camera: #07111B;
    --color-overlay: rgba(220, 248, 255, .96);
    --color-overlay-border: rgba(105, 213, 244, .68);
    --color-overlay-border-soft: rgba(105, 213, 244, .3);
    --color-overlay-glass: rgba(7, 17, 27, .92);
    --color-camera-glass: rgba(7, 17, 27, .82);
    --color-lavender-hover: #318CEB;
    --color-error: #FF8C91;
    --color-error-soft: rgba(255, 140, 145, .12);
    --shadow-panel: 0 24px 70px rgba(0, 0, 0, .38), 0 0 35px rgba(32, 139, 205, .08);
    --shadow-camera: 0 12px 32px rgba(0, 0, 0, .3);
    --shadow-scan: 0 0 14px rgba(56, 201, 237, .52);
    --shadow-lavender: 0 3px 14px rgba(24, 138, 220, .24);
    --shadow-lavender-hover: 0 5px 20px rgba(24, 165, 235, .3);
    --accent: #46D6F3;
    background:
      radial-gradient(ellipse at 82% 12%, rgba(27, 117, 170, .17), transparent 38%),
      radial-gradient(ellipse at 8% 88%, rgba(20, 77, 125, .14), transparent 42%),
      #07111B;
  }

  .hud {
    width: 100%;
    max-width: 1000px;
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    border-radius: 32px;
    padding: clamp(24px, 5vw, 48px);
    display: grid;
    grid-template-columns: minmax(0, 1.08fr) minmax(280px, .92fr);
    grid-template-areas:
      "header header"
      "video indicator"
      "video mascot"
      "video status"
      "video hint"
      "video controls";
    align-items: center;
    column-gap: clamp(28px, 5vw, 56px);
    row-gap: 18px;
    box-shadow: var(--shadow-panel);
    transition: background-color .3s ease, border-color .3s ease, color .3s ease, box-shadow .3s ease;
  }

  .header { grid-area: header; text-align: center; padding-bottom: 8px; }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2.5vw, 18px);
  }
  .brand-logo {
    display: block;
    width: clamp(116px, 15vw, 156px);
    max-width: 48%;
    height: auto;
    flex: 0 1 auto;
    object-fit: contain;
  }
  .mode-identity { display: none; }
  .mode-identity-name,
  .mode-identity-caption { display: block; }
  h1 {
    color: var(--color-ink);
    font-size: clamp(34px, 6vw, 48px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: .16em;
    padding-left: .16em;
  }
  .subtitle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    padding: 6px 13px;
    border: 1px solid var(--color-line);
    border-radius: 999px;
    background: var(--color-cream);
    color: var(--color-muted);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .mode-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 34px;
    margin-top: 9px;
    padding: 6px 13px;
    border: 1px solid var(--color-line);
    border-radius: 999px;
    background: transparent;
    color: var(--color-muted);
    font: inherit;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: background-color .25s ease, border-color .25s ease, color .25s ease, transform .16s ease;
  }
  .mode-toggle:hover { transform: translateY(-1px); }
  body[data-assistant-mode="jarvis"] .mode-toggle {
    border-color: #48DDF4;
    background: rgba(72, 221, 244, .1);
    color: #48DDF4;
  }
  body[data-assistant-mode="jarvis"] .brand-logo { display: none; }
  body[data-assistant-mode="jarvis"] .mode-identity {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    padding: 3px 0 3px 14px;
    border-left: 2px solid #32C9F0;
    text-align: left;
  }
  body[data-assistant-mode="jarvis"] .mode-identity-name {
    color: #EAF9FF;
    font-size: clamp(25px, 5vw, 34px);
    font-weight: 700;
    letter-spacing: .2em;
    line-height: 1;
  }
  body[data-assistant-mode="jarvis"] .mode-identity-caption {
    color: #83AFC3;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .15em;
  }
  body[data-assistant-mode="jarvis"] .subtitle {
    background: rgba(12, 32, 45, .72);
    border-color: rgba(97, 189, 221, .24);
    color: #B4D3E1;
  }
  body[data-assistant-mode="jarvis"] .mode-toggle:focus-visible {
    outline: 3px solid #58DDF8;
    outline-offset: 3px;
  }
  .subtitle::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--color-peach-vivid);
  }

  .video-wrapper {
    grid-area: video;
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 24px;
    overflow: hidden;
    background: var(--color-camera);
    border: 1px solid var(--color-line);
    box-shadow: var(--shadow-camera);
    transition: border-color .3s ease, box-shadow .3s ease, background-color .3s ease;
  }
  video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: filter .25s ease;
  }
  body[data-state="thinking"] video { filter: brightness(.88) saturate(.9); }

  .corner {
    position: absolute;
    width: 24px;
    height: 24px;
    border: 2px solid var(--color-overlay-border);
    transition: border-color .2s ease;
  }
  .corner.tl { top: 14px; left: 14px; border-right: 0; border-bottom: 0; border-top-left-radius: 9px; }
  .corner.tr { top: 14px; right: 14px; border-left: 0; border-bottom: 0; border-top-right-radius: 9px; }
  .corner.bl { bottom: 14px; left: 14px; border-right: 0; border-top: 0; border-bottom-left-radius: 9px; }
  .corner.br { bottom: 14px; right: 14px; border-left: 0; border-top: 0; border-bottom-right-radius: 9px; }

  .tag {
    position: absolute;
    top: 14px;
    left: 48px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 11px;
    border: 1px solid var(--color-overlay-border-soft);
    border-radius: 999px;
    background: var(--color-camera-glass);
    color: var(--color-overlay);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .1em;
  }
  .tag i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--color-peach-vivid);
    animation: breathe 1.8s ease-in-out infinite;
  }

  .scan {
    position: absolute;
    z-index: 1;
    left: 10%;
    right: 10%;
    top: 0;
    height: 2px;
    border-radius: 50%;
    background: var(--color-peach);
    box-shadow: var(--shadow-scan);
    opacity: 0;
    pointer-events: none;
  }
  body[data-state="thinking"] .scan { opacity: 1; animation: scan 2.4s ease-in-out infinite; }

  .thinking-label {
    position: absolute;
    inset: auto 0 16px;
    width: max-content;
    max-width: calc(100% - 32px);
    margin: auto;
    padding: 8px 13px;
    border-radius: 999px;
    background: var(--color-overlay-glass);
    color: var(--color-ink);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .08em;
    opacity: 0;
  }
  body[data-state="thinking"] .thinking-label { opacity: 1; }

  .indicator {
    grid-area: indicator;
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }
  .orb {
    position: relative; flex: 0 0 64px; width: 64px; height: 64px;
    display: grid; place-items: center;
  }
  .orb .core {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--color-lavender);
    box-shadow: 0 0 0 8px var(--color-lavender-soft);
    transition: background .2s ease, box-shadow .2s ease;
  }
  .orb .ring {
    position: absolute; inset: 6px; border-radius: 50%;
    border: 2px solid var(--accent); opacity: 0;
  }
  .orb .bars { display: none; gap: 4px; align-items: center; height: 34px; }
  .orb .bars i { width: 5px; height: 8px; border-radius: 3px; background: var(--color-peach-deep); animation: eq .8s ease-in-out infinite; }
  .orb .bars i:nth-child(2) { animation-delay: .15s; }
  .orb .bars i:nth-child(3) { animation-delay: .30s; }
  .orb .bars i:nth-child(4) { animation-delay: .10s; }
  .orb .bars i:nth-child(5) { animation-delay: .25s; }

  body[data-state="listening"] .ring { animation: ripple 1.8s ease-out infinite; }
  body[data-state="listening"] .ring.r2 { animation-delay: .9s; }
  body[data-state="listening"] .core { animation: breathe 1.8s ease-in-out infinite; background: var(--color-lavender-deep); box-shadow: 0 0 0 8px var(--color-lavender-soft); }
  body[data-state="thinking"] .ring.r1 {
    opacity: 1; border-color: transparent; border-top-color: var(--accent); border-right-color: var(--accent);
    animation: spin 1.4s linear infinite; inset: 2px;
  }
  body[data-state="speaking"] .core { display: none; }
  body[data-state="speaking"] .bars { display: flex; }
  body[data-state="error"] .core { background: var(--color-error); box-shadow: 0 0 0 8px var(--color-error-soft); }

  .mascot-stage {
    grid-area: mascot;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-width: 0;
    min-height: 148px;
    pointer-events: none;
    transition: background-color .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .mascot-illustration {
    display: block;
    flex: 0 1 auto;
    width: clamp(128px, 16vw, 156px);
    max-width: 54%;
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 5px 5px rgba(55, 53, 68, .08));
  }
  .mascot-jarvis-illustration { display: none; }
  body[data-assistant-mode="jarvis"] .mascot-bia-illustration { display: none; }
  body[data-assistant-mode="jarvis"] .mascot-jarvis-illustration { display: block; }
  body[data-assistant-mode="jarvis"] .mascot-jarvis-illustration .jarvis-hair-back,
  body[data-assistant-mode="jarvis"] .mascot-jarvis-illustration .jarvis-hair-front { fill: #302820; }
  body[data-assistant-mode="jarvis"] .mascot-jarvis-illustration .jarvis-skin { fill: #E8C5A9; }
  body[data-assistant-mode="jarvis"] .mascot-jarvis-illustration .jarvis-suit { fill: #18354B; }
  body[data-assistant-mode="jarvis"] .mascot-jarvis-illustration .jarvis-suit-light { fill: #244D66; }
  body[data-assistant-mode="jarvis"] .mascot-jarvis-illustration .jarvis-trim { fill: #42CBEA; }
  body[data-assistant-mode="jarvis"] .mascot-jarvis-illustration .jarvis-iris { fill: #43BBD9; }
  body[data-assistant-mode="jarvis"] .mascot-jarvis-illustration .mascot-ink { fill: #183447; }
  body[data-assistant-mode="jarvis"] .mascot-jarvis-illustration .mascot-mouth-smile,
  body[data-assistant-mode="jarvis"] .mascot-jarvis-illustration .mascot-mouth-closed,
  body[data-assistant-mode="jarvis"] .mascot-jarvis-illustration .mascot-mouth-open,
  body[data-assistant-mode="jarvis"] .mascot-jarvis-illustration .mascot-mouth-wide,
  body[data-assistant-mode="jarvis"] .mascot-jarvis-illustration .mascot-mouth-round { fill: #8D4D59; }
  body[data-assistant-mode="jarvis"] .mascot-jarvis-illustration .mascot-mouth-smile,
  body[data-assistant-mode="jarvis"] .mascot-jarvis-illustration .mascot-mouth-closed { stroke: #8D4D59; }
  body[data-assistant-mode="jarvis"] .mascot-jarvis-illustration .mascot-mouth-smile { fill: none; }
  body[data-assistant-mode="jarvis"] .mascot-jarvis-illustration .mascot-mouth-closed { fill: none; }
  .mascot-skin { fill: #F2D2B7; }
  .mascot-hair { fill: #E9BE68; }
  .mascot-shirt { fill: var(--color-lavender); }
  .mascot-ink { fill: var(--color-ink); }
  .mascot-highlight { fill: var(--color-surface); }
  .mascot-accent { fill: var(--color-peach); }
  .mascot-blush { fill: #EBAF9F; opacity: .32; }
  .mascot-arm-left,
  .mascot-arm-right,
  .mascot-head,
  .mascot-torso,
  .mascot-eyes,
  .mascot-brow,
  .mascot-mouth-open,
  .mascot-mouth-smile,
  .mascot-mouth-closed {
    transform-box: fill-box;
    transform-origin: center;
  }
  .mascot-torso {
    --micro-torso-shift: 0px;
    translate: 0 calc(var(--torso-shift, 0px) + var(--micro-torso-shift));
    transform-origin: center bottom;
    transition: translate .55s cubic-bezier(.2,.75,.25,1);
  }
  .mascot-head {
    --micro-head-shift: 0px;
    --micro-head-rotate: 0deg;
    --gesture-head-shift: 0px;
    --gesture-head-rotate: 0deg;
    translate: 0 calc(var(--head-shift, 0px) + var(--micro-head-shift) + var(--gesture-head-shift));
    rotate: calc(var(--head-rotate, 0deg) + var(--micro-head-rotate) + var(--gesture-head-rotate));
    transition: translate .55s cubic-bezier(.2,.75,.25,1), rotate .55s cubic-bezier(.2,.75,.25,1);
  }
  .mascot-head { transform-box: view-box; transform-origin: 91px 58px; }
  .mascot-pupils { transition: transform .32s cubic-bezier(.2,.75,.25,1); }
  .mascot-eyes { scale: 1; transition: scale .35s cubic-bezier(.2,.75,.25,1); }
  .mascot-torso { animation: mascot-breathe 4.6s ease-in-out infinite; }
  .mascot-eyes.is-blinking { animation: mascot-blink 135ms ease-in-out; transform-origin: center; }
  .mascot-brow { transition: transform .3s cubic-bezier(.2,.75,.25,1); }
  .mascot-mouth-smile { display: inline; transition: transform .35s ease, stroke-width .35s ease; }
  .mascot-mouth-open,
  .mascot-mouth-wide,
  .mascot-mouth-round,
  .mascot-mouth-closed { display: none; }
  .mascot-arm-left,
  .mascot-arm-right { transform-box: fill-box; transform-origin: center 12%; transition: transform .58s cubic-bezier(.2,.75,.25,1); }
  #biaMascot[data-gaze="left"] .mascot-pupils { transform: translate(-1.6px, 0); }
  #biaMascot[data-gaze="right"] .mascot-pupils { transform: translate(1.6px, 0); }
  #biaMascot[data-gaze="upper-right"] .mascot-pupils { transform: translate(1.2px, -1.1px); }
  #biaMascot[data-gaze="lower-left"] .mascot-pupils { transform: translate(-1px, 1px); }
  #biaMascot[data-gaze="upper-left"] .mascot-pupils { transform: translate(-1.2px, -1px); }
  #biaMascot[data-mascot-state="listening"] { --head-rotate: -3deg; --head-shift: -1px; --torso-shift: 0px; }
  #biaMascot[data-mascot-state="listening"] .mascot-brow-left { transform: translateY(-2px) rotate(-4deg); }
  #biaMascot[data-mascot-state="listening"] .mascot-brow-right { transform: translateY(-2px) rotate(4deg); }
  #biaMascot[data-mascot-state="thinking"] { --head-rotate: -4deg; --head-shift: -1px; --torso-shift: 1px; }
  #biaMascot[data-mascot-state="thinking"] .mascot-brow-left { transform: translateY(-1px) rotate(5deg); }
  #biaMascot[data-mascot-state="thinking"] .mascot-brow-right { transform: translateY(-3px) rotate(-6deg); }
  #biaMascot[data-mascot-state="observing"] { --head-rotate: 2deg; --head-shift: 0px; --torso-shift: 0px; }
  #biaMascot[data-mascot-state="observing"] .mascot-brow { transform: translateY(-2px); }
  #biaMascot[data-mascot-state="speaking"] { --head-rotate: 0deg; --head-shift: 0px; --torso-shift: -1px; }
  #biaMascot[data-mascot-state="speaking"] .mascot-mouth-smile { display: none; }
  #biaMascot[data-mascot-state="speaking"] .mascot-mouth-closed { display: inline; }
  #biaMascot[data-mascot-state="speaking"][data-mouth="open"] .mascot-mouth-closed,
  #biaMascot[data-mascot-state="speaking"][data-mouth="wide"] .mascot-mouth-closed,
  #biaMascot[data-mascot-state="speaking"][data-mouth="round"] .mascot-mouth-closed { display: none; }
  #biaMascot[data-mascot-state="speaking"][data-mouth="open"] .mascot-mouth-open { display: inline; }
  #biaMascot[data-mascot-state="speaking"][data-mouth="wide"] .mascot-mouth-wide { display: inline; }
  #biaMascot[data-mascot-state="speaking"][data-mouth="round"] .mascot-mouth-round { display: inline; }
  #biaMascot[data-mascot-state="speaking"][data-mouth="wide"] .mascot-brow { transform: translateY(-1px); }
  #biaMascot[data-mascot-state="speaking"][data-mouth="round"] .mascot-brow-left { transform: translateY(-1px) rotate(2deg); }
  #biaMascot[data-mascot-state="speaking"][data-mouth="round"] .mascot-brow-right { transform: translateY(-1px) rotate(-2deg); }
  #biaMascot[data-mascot-state="speaking"][data-mouth="open"] .mascot-eyes { scale: 1.02; }
  #biaMascot.is-gesturing { --gesture-head-shift: -1px; --gesture-head-rotate: 1deg; }
  #biaMascot.is-gesturing[data-gesture="left"] .mascot-arm-left { transform: rotate(11deg) translateY(-2px); }
  #biaMascot.is-gesturing[data-gesture="right"] .mascot-arm-right { transform: rotate(-11deg) translateY(-2px); }
  #biaMascot.is-gesturing[data-gesture="welcome"] .mascot-arm-left { transform: rotate(8deg) translateY(-2px); }
  #biaMascot.is-gesturing[data-gesture="welcome"] .mascot-arm-right { transform: rotate(-8deg) translateY(-2px); }
  #biaMascot.is-micro-moving[data-micro-action="tilt"] { --micro-head-rotate: 2deg; --micro-head-shift: -1px; }
  #biaMascot.is-micro-moving[data-micro-action="settle"] { --micro-torso-shift: 1px; }
  #biaMascot[data-mascot-state="speaking"] .mascot-torso { animation-duration: 2.6s; }
  #biaMascot[data-mascot-state="happy"] { --head-shift: -2px; --head-rotate: 0deg; --torso-shift: -1px; }
  #biaMascot[data-expression="happy"] .mascot-brow { transform: translateY(-2px); }
  #biaMascot[data-expression="happy"] .mascot-mouth-smile { stroke-width: 3.5; transform: scale(1.08); }
  #biaMascot[data-expression="happy"] .mascot-eyes { scale: 1.04; }
  #biaMascot[data-mascot-state="error"] .mascot-brow-left { transform: rotate(6deg); }

    imageMaxSide: 1024,              // maior lado da foto enviada (px)
    imageQuality: 0.75,              // qualidade JPEG (0 a 1)
    apiTimeoutMs: 55000,
    firstEnvironmentScanMs: 15000,
    environmentScanIntervalMs: 60000,
    recognitionRestartMs: 700
  };
  const WAKE_ONE = /\b(bia|bea|via)\b/;
  const WAKE_ALL = /\b(bia|bea|via)\b/g;

  /* ================= ELEMENTOS ================= */
  const $ = (id) => document.getElementById(id);
  const video = $("video"), statusEl = $("status"), stateLabel = $("stateLabel");
  const mascot = $("biaMascot");
  const app = $("app"), modeToggle = $("modeToggle");
  const themeColorMeta = document.querySelector('meta[name="theme-color"]');
  const startBtn = $("startSystem"), muteMicBtn = $("muteMic"), hint = $("hint");
  const ASSISTANT_MODES = { BIA: "bia", JARVIS: "jarvis" };
  const MASCOT_APP_STATES = {
    off: "idle",
    muted: "idle",
    listening: "listening",
    thinking: "thinking",
    reconnecting: "idle",
    error: "error"
  };
  const MASCOT_EXPRESSIONS = {
    idle: "neutral",
    listening: "attentive",
    thinking: "curious",
    speaking: "speaking",
    happy: "happy",
    observing: "curious",
    error: "confused"
  };
  const MASCOT_BASE_GAZE = {
    idle: "center",
    listening: "center",
    thinking: "upper-right",
    speaking: "center",
    happy: "center",
    observing: "left",
    error: "lower-left"
  };

  /* ================= ESTADO ================= */
  let stream = null, recognition = null, wakeLock = null;
  let assistantMode = ASSISTANT_MODES.BIA;
  let systemOn = false;       // sistema iniciado
  let busy = false;           // processando ou falando (reconhecimento pausado)
  let micBlocked = false;     // permissão de microfone negada
  let micMuted = false;
  let recognitionRunning = false, recognitionStarting = false;
  let restartTimer = null;
  let environmentScanTimer = null;
  const reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
  let mascotBlinkTimer = null, mascotBlinkReleaseTimer = null, mascotSecondBlinkTimer = null;
  let mascotGazeTimer = null, mascotGazeResetTimer = null, mascotGestureTimer = null;
  let mascotGestureReleaseTimer = null, mascotMicroTimer = null, mascotMicroResetTimer = null;

  function setState(state, label) {
    document.body.dataset.state = state;
    stateLabel.textContent = label;
    if (MASCOT_APP_STATES[state]) {
      const transientEmotion = mascotEmotionTimer !== null &&
        ["happy", "error"].includes(mascot.dataset.mascotState);
      const settlingState = ["listening", "reconnecting", "muted"].includes(state);
      if (!transientEmotion || !settlingState) setMascotState(MASCOT_APP_STATES[state]);
    }
  }
  function showStatus(text) { statusEl.textContent = text; }
  function setAssistantMode(mode) {
    if (!Object.values(ASSISTANT_MODES).includes(mode)) {
      throw new Error(`Modo de assistente inválido: ${mode}`);
    }
    assistantMode = mode;
    document.body.dataset.assistantMode = mode;
    app.dataset.assistantMode = mode;
    const isJarvis = mode === ASSISTANT_MODES.JARVIS;
    modeToggle.textContent = isJarvis ? "Voltar para BIA" : "Ativar JARVIS";
    modeToggle.setAttribute("aria-pressed", String(isJarvis));
    themeColorMeta.setAttribute("content", isJarvis ? "#07111B" : "#F7F4F0");
    mascot.setAttribute("aria-label", isJarvis
      ? "Mascote ilustrado JARVIS, com cabelo castanho escuro, olhos ciano e traje azul-marinho."
      : "Placeholder técnico da mascote BIA; a arte final ainda será criada.");
    updateMascotMotion();
  }
  function activeMascotIllustration() {
    return mascot.querySelector(assistantMode === ASSISTANT_MODES.JARVIS
      ? ".mascot-jarvis-illustration"
      : ".mascot-bia-illustration");
  }
  function buzz(pattern) { try { navigator.vibrate && navigator.vibrate(pattern); } catch (e) {} }
  function createRequestId() {
    const bytes = new Uint8Array(16);
    if (window.crypto && window.crypto.getRandomValues) {
      window.crypto.getRandomValues(bytes);
    } else {
      for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
    }
    bytes[6] = (bytes[6] & 0x0f) | 0x40;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    const hex = Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
    return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
  }
  function updateMicButton() {
    const unavailable = !SR || micBlocked;
    muteMicBtn.disabled = unavailable;
    muteMicBtn.setAttribute("aria-pressed", String(micMuted));
    muteMicBtn.textContent = unavailable
      ? "🎙️ Microfone indisponível — confira as permissões"
      : micMuted
        ? "🔇 Microfone silenciado — toque para reativar"
        : "🎙️ Microfone ligado — toque para silenciar";
  }

  /* ================= VOZ (TEXT-TO-SPEECH) ================= */
  const hasTTS = "speechSynthesis" in window;
  let voices = [];
  let speakToken = 0, keepAlive = null, watchdog = null, speechStartTimer = null;
  let activeSpeechResolve = null;
  let mascotEmotionTimer = null, speechBoundaryTimer = null, mascotSpeechTimer = null;
  let mascotSpeechSequence = [], mascotSpeechSequenceIndex = 0, mascotSpeechSequenceToken = 0;
  let activeMascotSpeechText = "";

  const randomDelay = (minimum, maximum) =>
    Math.round(minimum + Math.random() * (maximum - minimum));

  function canMascotAnimate() {
    return !reducedMotionQuery.matches && !document.hidden;
  }

  function mascotCanBlink() {
    return canMascotAnimate() &&
      ["idle", "listening", "thinking", "observing", "speaking", "happy"].includes(mascot.dataset.mascotState);
  }

  function blinkMascot() {
    if (!mascotCanBlink()) return;
    const eyes = activeMascotIllustration().querySelector(".mascot-eyes");
    eyes.classList.add("is-blinking");
    clearTimeout(mascotBlinkReleaseTimer);
    mascotBlinkReleaseTimer = setTimeout(() => eyes.classList.remove("is-blinking"), 135);
  }

  function scheduleMascotBlink() {
    clearTimeout(mascotBlinkTimer);
    clearTimeout(mascotSecondBlinkTimer);
    if (!mascotCanBlink()) return;

    mascotBlinkTimer = setTimeout(() => {
      blinkMascot();
      if (Math.random() < 0.12) {
        mascotSecondBlinkTimer = setTimeout(() => {
          blinkMascot();
          scheduleMascotBlink();
        }, 250);
      } else {
        scheduleMascotBlink();
      }
    }, randomDelay(2600, 5700));
  }

  function baseGazeForState(state) {
    return MASCOT_BASE_GAZE[state] || "center";
  }

  function scheduleMascotGaze() {
    clearTimeout(mascotGazeTimer);
    clearTimeout(mascotGazeResetTimer);
    const state = mascot.dataset.mascotState;
    if (!canMascotAnimate() || !["idle", "thinking", "observing"].includes(state)) return;

    mascotGazeTimer = setTimeout(() => {
      const directions = state === "thinking"
        ? ["upper-right", "upper-left", "center"]
        : state === "observing"
          ? ["left", "right", "center"]
          : ["left", "right", "center"];
      const next = directions[Math.floor(Math.random() * directions.length)];
      mascot.dataset.gaze = next;
      mascotGazeResetTimer = setTimeout(() => {
        mascot.dataset.gaze = baseGazeForState(mascot.dataset.mascotState);
        scheduleMascotGaze();
      }, randomDelay(500, 1050));
    }, state === "thinking" ? randomDelay(2600, 4700) : randomDelay(3400, 7200));
  }

  function scheduleMascotGesture() {
    clearTimeout(mascotGestureTimer);
    if (!canMascotAnimate() || mascot.dataset.mascotState !== "speaking") return;

    mascotGestureTimer = setTimeout(() => {
      mascot.dataset.gesture = Math.random() < 0.5 ? "left" : "right";
      mascot.classList.add("is-gesturing");
      mascotGestureReleaseTimer = setTimeout(() => {
        mascot.classList.remove("is-gesturing");
        delete mascot.dataset.gesture;
      }, randomDelay(620, 980));
      scheduleMascotGesture();
    }, randomDelay(1600, 3400));
  }

  function scheduleMascotMicroMotion() {
    clearTimeout(mascotMicroTimer);
    const state = mascot.dataset.mascotState;
    if (!canMascotAnimate() || !["idle", "thinking"].includes(state)) return;

    mascotMicroTimer = setTimeout(() => {
      const action = Math.random() < 0.65 ? "tilt" : "settle";
      mascot.dataset.microAction = action;
      mascot.classList.add("is-micro-moving");
      mascotMicroResetTimer = setTimeout(() => {
        mascot.classList.remove("is-micro-moving");
        delete mascot.dataset.microAction;
        scheduleMascotMicroMotion();
      }, randomDelay(560, 920));
    }, state === "thinking" ? randomDelay(2700, 5000) : randomDelay(4300, 8500));
  }

  function clearMascotSpeechMotion() {
    clearTimeout(mascotSpeechTimer);
    clearTimeout(speechBoundaryTimer);
    mascotSpeechTimer = null;
    speechBoundaryTimer = null;
  }

  function mouthPosesForWord(word) {
    const vowels = word.match(/[aeiouáéíóúâêôãõ]+/gi) || [];
    const poses = vowels.map((group) => {
      const vowel = group.toLocaleLowerCase("pt-BR");
      if (/[eiéíê]/.test(vowel)) return "wide";
      if (/[ouóúô]/.test(vowel)) return "round";
      return "open";
    });
    return poses.filter((pose, index) => index === 0 || pose !== poses[index - 1]);
  }

  function mouthPoseForWord(word) {
    const poses = mouthPosesForWord(word);
    return poses[Math.floor(poses.length / 2)] || "closed";
  }

  function scheduleFallbackMouthPoses(token, poses, index, duration) {
    if (token !== speakToken || mascot.dataset.mascotState !== "speaking" ||
      document.hidden || mascot.dataset.speechBoundaries === "true") return;
    if (index >= poses.length) {
      mascot.dataset.mouth = "closed";
      mascotSpeechTimer = setTimeout(() => scheduleFallbackMouth(token), 45);
      return;
    }
    mascot.dataset.mouth = poses[index];
    mascotSpeechTimer = setTimeout(() => {
      scheduleFallbackMouthPoses(token, poses, index + 1, duration);
    }, duration);
  }

  function scheduleFallbackMouth(token) {
    if (token !== speakToken || mascot.dataset.mascotState !== "speaking" ||
      document.hidden || mascot.dataset.speechBoundaries === "true") return;

    const segment = mascotSpeechSequence[mascotSpeechSequenceIndex++];
    if (!segment) {
      mascot.dataset.mouth = "closed";
      return;
    }
    if (/^[,.!?;:…]+$/.test(segment)) {
      mascot.dataset.mouth = "closed";
      const pause = /[.!?…]/.test(segment) ? 300 : 150;
      mascotSpeechTimer = setTimeout(() => scheduleFallbackMouth(token), pause);
      return;
    }

    const poses = mouthPosesForWord(segment);
    if (!poses.length) {
      mascot.dataset.mouth = "closed";
      mascotSpeechTimer = setTimeout(() => scheduleFallbackMouth(token), 70);
      return;
    }
    const duration = Math.max(140, Math.min(370, 105 + segment.length * 28)) / poses.length;
    scheduleFallbackMouthPoses(token, poses, 0, duration);
  }

  function startFallbackMouth(text, token) {
    clearTimeout(mascotSpeechTimer);
    mascotSpeechSequence = text.match(/[A-Za-zÀ-ÿ0-9'’-]+|[,.!?;:…]+/g) || [];
    mascotSpeechSequenceIndex = 0;
    mascotSpeechSequenceToken = token;
    scheduleFallbackMouth(token);
  }

  function updateMascotMotion() {
    clearTimeout(mascotBlinkTimer);
    clearTimeout(mascotBlinkReleaseTimer);
    clearTimeout(mascotSecondBlinkTimer);
    clearTimeout(mascotGazeTimer);
    clearTimeout(mascotGazeResetTimer);
    clearTimeout(mascotGestureTimer);
    clearTimeout(mascotGestureReleaseTimer);
    clearTimeout(mascotMicroTimer);
    clearTimeout(mascotMicroResetTimer);
    activeMascotIllustration().querySelector(".mascot-eyes").classList.remove("is-blinking");
    mascot.dataset.pageHidden = String(document.hidden);
    mascot.dataset.gaze = baseGazeForState(mascot.dataset.mascotState);
    mascot.classList.remove("is-gesturing");
    mascot.classList.remove("is-micro-moving");
    delete mascot.dataset.gesture;
    delete mascot.dataset.microAction;
    scheduleMascotBlink();
    scheduleMascotGaze();
    scheduleMascotGesture();
    scheduleMascotMicroMotion();
  }

  function setMascotState(state) {
    if (mascot.dataset.mascotState === state) return;
    clearTimeout(mascotEmotionTimer);
    mascotEmotionTimer = null;
    clearMascotSpeechMotion();
    mascot.dataset.mascotState = state;
    mascot.dataset.expression = MASCOT_EXPRESSIONS[state] || "neutral";
    mascot.dataset.speechBoundaries = "false";
    delete mascot.dataset.mouth;
    updateMascotMotion();
  }

  function restoreMascotState() {
    setMascotState(MASCOT_APP_STATES[document.body.dataset.state] || "idle");
  }

  function showMascotHappyMoment() {
    clearTimeout(mascotEmotionTimer);
    setMascotState("happy");
    if (canMascotAnimate()) {
      mascot.dataset.gesture = "welcome";
      mascot.classList.add("is-gesturing");
      mascotGestureReleaseTimer = setTimeout(() => {
        mascot.classList.remove("is-gesturing");
        delete mascot.dataset.gesture;
      }, 700);
    }
    mascotEmotionTimer = setTimeout(() => {
      if (mascot.dataset.mascotState === "happy") restoreMascotState();
    }, randomDelay(1050, 1450));
  }

  function showMascotErrorMoment() {
    clearTimeout(mascotEmotionTimer);
    setMascotState("error");
    mascotEmotionTimer = setTimeout(() => {
      if (mascot.dataset.mascotState === "error") restoreMascotState();
    }, randomDelay(900, 1250));
  }

  if (typeof reducedMotionQuery.addEventListener === "function") {
    reducedMotionQuery.addEventListener("change", updateMascotMotion);
  } else {
    reducedMotionQuery.addListener(updateMascotMotion);
  }
  updateMascotMotion();

  function loadVoices() { voices = window.speechSynthesis.getVoices() || []; }
  if (hasTTS) {
    loadVoices();
    if (typeof window.speechSynthesis.addEventListener === "function") {
      window.speechSynthesis.addEventListener("voiceschanged", loadVoices);
    } else {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }
  }

  const FEMALE_VOICE = /francisca|luciana|maria|camila|bruna|fernanda|joana|female|feminina|woman/i;
  const MALE_VOICE = /(^|[\s_-])(male|masculino|man)([\s_-]|$)/i;
  const JARVIS_MALE_VOICE = /(^|[\s_-])(male|masculino|man|daniel|antonio|andré|andre|ricardo|lucas|thiago|tiago|felipe|joão|joao|bruno|rafael|gustavo|pedro)([\s_-]|$)/i;

  function waitForVoices() {
    loadVoices();
    if (voices.length) return Promise.resolve(voices);

    return new Promise((resolve) => {
      let settled = false;
      let fallbackHandler = null;
      const previousHandler = window.speechSynthesis.onvoiceschanged;
      const finish = () => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        if (typeof window.speechSynthesis.removeEventListener === "function") {
          window.speechSynthesis.removeEventListener("voiceschanged", finish);
        } else if (window.speechSynthesis.onvoiceschanged === fallbackHandler) {
          window.speechSynthesis.onvoiceschanged = previousHandler || null;
        }
        loadVoices();
        resolve(voices);
      };
      const timer = setTimeout(finish, 1200);
      if (typeof window.speechSynthesis.addEventListener === "function") {
        window.speechSynthesis.addEventListener("voiceschanged", finish);
      } else {
        fallbackHandler = () => {
          if (typeof previousHandler === "function") previousHandler.call(window.speechSynthesis);
          finish();
        };
        window.speechSynthesis.onvoiceschanged = fallbackHandler;
      }
    });
  }

  function portugueseVoices() {
    const brazilianPortuguese = voices.filter((v) => /^pt[-_]br$/i.test(v.lang));
    return brazilianPortuguese.length
      ? brazilianPortuguese
      : voices.filter((v) => /^pt(?:[-_]|$)/i.test(v.lang));
  }

  function voiceScore(voice) {
    let value = 0;
    if (/natural|neural|online|premium/i.test(voice.name)) value += 100;
    if (!voice.localService) value += 15;
    if (/google|microsoft/i.test(voice.name)) value += 10;
    return value;
  }

  function pickVoice(mode = assistantMode) {
    const portuguese = portugueseVoices();
    if (mode === ASSISTANT_MODES.JARVIS) {
      const masculineVoices = portuguese.filter((voice) => JARVIS_MALE_VOICE.test(voice.name));
      if (masculineVoices.length) {
        return masculineVoices.sort((a, b) => voiceScore(b) - voiceScore(a))[0];
      }
    }

    const score = (v) => {
      let value = FEMALE_VOICE.test(v.name) ? 500 : 0;
      if (MALE_VOICE.test(v.name)) value -= 500;
      return value + voiceScore(v);
    };
    return portuguese.sort((a, b) => score(b) - score(a))[0] || null;
  }

  // Mantém as frases juntas para aproveitar a prosódia natural do navegador.
  function chunkText(text) {
    const parts = text.match(/[^.!?…\n]+[.!?…]*|\n+/g) || [text];
    const out = [];
    let current = "";
    for (const part of parts) {
      const sentence = part.trim();
      if (!sentence) {
        if (current) { out.push(current); current = ""; }
        continue;
      }
      if (sentence.length > 220) {
        if (current) { out.push(current); current = ""; }
        let fragment = "";
        for (const word of sentence.split(/\s+/)) {
          if (fragment && (fragment + " " + word).length > 180) {
            out.push(fragment);
            fragment = word;
          } else {
            fragment += (fragment ? " " : "") + word;
          }
        }
        if (fragment) out.push(fragment);
      } else if (current && (current + " " + sentence).length > 220) {
        out.push(current);
        current = sentence;
      } else {
        current += (current ? " " : "") + sentence;
      }
    }
    if (current) out.push(current);
    return out;
  }

  // "Fala fantasma": precisa rodar dentro de um toque do usuário para liberar o áudio no Android
  function unlockAudio() {
    if (!hasTTS) return;
    try {
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();
      const ghost = new SpeechSynthesisUtterance(".");
      ghost.volume = 0;
      ghost.lang = "pt-BR";
      window.speechSynthesis.speak(ghost);
    } catch (e) {}
  }

  function stopSpeaking() {
    speakToken++;
    clearInterval(keepAlive); clearTimeout(watchdog);
    clearTimeout(speechStartTimer);
    clearMascotSpeechMotion();
    activeMascotSpeechText = "";
    if (mascot.dataset.mascotState === "speaking") setMascotState("idle");
    if (hasTTS) window.speechSynthesis.cancel();
    if (activeSpeechResolve) {
      const resolve = activeSpeechResolve;
      activeSpeechResolve = null;
      resolve();
    }
  }

  // Fala o texto e, ao terminar, volta a escutar
  function speak(text, onStart = null, onComplete = null, mode = assistantMode) {
    return new Promise((resolve) => {
      const speechMode = mode;
      showStatus("BEA: " + text);
      busy = true;
      stopRecognition();
      stopSpeaking();
      const token = speakToken;

      const done = (endedNaturally = false) => {
        if (token !== speakToken) return;
        clearInterval(keepAlive); clearTimeout(watchdog);
        clearTimeout(speechStartTimer);
        clearMascotSpeechMotion();
        activeMascotSpeechText = "";
        mascot.dataset.mouth = "closed";
        if (activeSpeechResolve === resolve) activeSpeechResolve = null;
        if ($("biaMascot").dataset.mascotState === "speaking") setMascotState("idle");
        resumeListening();
        if (endedNaturally && started && typeof onComplete === "function") onComplete();
        resolve();
      };

      activeSpeechResolve = resolve;
      if (!hasTTS) { speechStartTimer = setTimeout(done, 300); return; }

      setState("speaking", "Falando…");
      const chunks = chunkText(text);
      let voice = null;
      let i = 0, started = false;

      const next = () => {
        if (token !== speakToken) return;
        if (i >= chunks.length) { done(); return; }
        const u = new SpeechSynthesisUtterance(chunks[i++]);
        u.lang = "pt-BR";
        u.rate = 0.96;
        u.pitch = speechMode === ASSISTANT_MODES.JARVIS ? 1 : 1.03;
        u.volume = 1;
        if (voice) u.voice = voice;
        u.onstart = () => {
          if (token !== speakToken) return;
          started = true;
          setMascotState("speaking");
          activeMascotSpeechText = u.text;
          mascot.dataset.speechBoundaries = "false";
          mascot.dataset.mouth = "closed";
          startFallbackMouth(u.text, token);
          if (typeof onStart === "function") onStart();
        };
        u.onboundary = (event) => {
          if (token !== speakToken || (event.name && event.name !== "word") ||
            !Number.isInteger(event.charIndex) || event.charIndex < 0) return;
          clearTimeout(mascotSpeechTimer);
          mascotSpeechTimer = null;
          const word = chunks[i - 1].slice(event.charIndex).match(/^[\s,.!?;:…]*([^\s,.!?;:…]+)/);
          const wordText = word ? word[1] : "";
          const mouth = mouthPoseForWord(wordText);
          mascot.dataset.speechBoundaries = "true";
          mascot.dataset.mouth = mouth;
          clearTimeout(speechBoundaryTimer);
          const boundaryLength = Number.isInteger(event.charLength) && event.charLength > 0
            ? event.charLength
            : Math.max(3, wordText.length);
          speechBoundaryTimer = setTimeout(() => {
            if (mascot.dataset.mascotState === "speaking") mascot.dataset.mouth = "closed";
          }, Math.min(360, Math.max(120, boundaryLength * 42)));
        };
        u.onend = () => {
          if (token !== speakToken) return;
          clearMascotSpeechMotion();
          activeMascotSpeechText = "";
          mascot.dataset.mouth = "closed";
          if (i >= chunks.length) {
            done(true);
            return;
          }
          setMascotState("idle");
          const pause = /[,;:]$/.test(chunks[i - 1]) ? 120 : 180;
          speechStartTimer = setTimeout(next, pause);
        };
        u.onerror = (e) => {
          if (token !== speakToken) return;
          clearMascotSpeechMotion();
          activeMascotSpeechText = "";
          mascot.dataset.mouth = "closed";
          setMascotState(e.error === "canceled" || e.error === "interrupted" ? "idle" : "error");
          if (e.error === "canceled" || e.error === "interrupted") { done(); return; }
          next();
        };
        window.speechSynthesis.resume();
        window.speechSynthesis.speak(u);
      };

      waitForVoices().then(() => {
        if (token !== speakToken) return;
        if (!chunks.length) { done(); return; }
        voice = pickVoice(speechMode);
        speechStartTimer = setTimeout(next, 100);
        keepAlive = setInterval(() => {
          if (window.speechSynthesis.speaking) window.speechSynthesis.resume();
        }, 5000);
        watchdog = setTimeout(() => {
          if (!started && token === speakToken) {
            window.speechSynthesis.cancel();
            showStatus("BEA: " + text + "\n\n(Sem áudio? Confira o volume de mídia do aparelho.)");
            done();
          }
        }, 8000);
      });
    });
  }

  /* ================= RECONHECIMENTO DE VOZ ================= */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function buildRecognition() {
    recognition = new SR();
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = "pt-BR";

    recognition.onstart = () => {
      recognitionStarting = false;
      recognitionRunning = true;
      if (busy || micMuted || micBlocked) {
        stopRecognition();
        return;
      }
      setState("listening", "Ouvindo… diga “Bia”");
      showStatus("Microfone ativo. Diga “Bia” e faça seu pedido.");
    };

    recognition.onresult = (event) => {
      if (busy || micMuted || micBlocked) return;
      const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
      if (!WAKE_ONE.test(transcript)) return;
      const command = transcript.replace(WAKE_ALL, "").replace(/^[\s,.:;!?-]+/, "").trim();

      if (!command) {
        speak("Estou ouvindo. O que deseja?");
      } else {
        processCommand(command);
      }
    };

    recognition.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        micBlocked = true;
        updateMicButton();
        fail("Microfone bloqueado. Permita o acesso ao microfone nas configurações do navegador e recarregue a página.");
      } else if (e.error === "audio-capture") {
        micBlocked = true;
        updateMicButton();
        fail("Não encontrei nenhum microfone neste aparelho.");
      } else if (e.error === "network") {
        setState("reconnecting", "Reconectando microfone…");
        showStatus("O reconhecimento de voz perdeu a internet. Tentando de novo…");
      }
    };

    recognition.onend = () => {
      recognitionRunning = false;
      recognitionStarting = false;
      scheduleRestart();
    };
  }

  function startRecognition() {
    if (!systemOn || busy || micMuted || micBlocked) return;
    if (!SR) {
      micBlocked = true;
      updateMicButton();
      setState("error", "Sem reconhecimento de voz");
      showStatus("Este navegador não tem reconhecimento de voz. Use um navegador compatível, como o Google Chrome.");
      return;
    }
    if (!recognition) buildRecognition();
    if (recognitionRunning || recognitionStarting) return;
    recognitionStarting = true;
    setState("reconnecting", "Conectando microfone…");
    try {
      recognition.start();
    } catch (error) {
      recognitionStarting = false;
      console.warn("Não foi possível iniciar o reconhecimento de voz.", {
        name: error.name || "Error"
      });
      setState("error", "Microfone indisponível");
      showStatus("Não foi possível iniciar a escuta. Confira a permissão do microfone e tente reativá-lo.");
    }
  }

  // abort() solta o microfone na hora (stop() demora e atrapalha a fala)
  function stopRecognition() {
    clearTimeout(restartTimer);
    recognitionStarting = false;
    if (recognition) { try { recognition.abort(); } catch (e) {} }
  }

  function scheduleRestart() {
    if (!systemOn || busy || micMuted || micBlocked) return;
    clearTimeout(restartTimer);
    setState("reconnecting", "Reconectando microfone…");
    restartTimer = setTimeout(() => {
      if (systemOn && !busy && !micMuted && !micBlocked) startRecognition();
    }, CONFIG.recognitionRestartMs);
  }

  function resumeListening() {
    busy = false;
    if (!systemOn) return;
    if (micMuted) {
      setState("muted", "Microfone silenciado");
      showStatus("Microfone silenciado. Toque em “Reativar microfone” para voltar à escuta.");
      return;
    }
    if (micBlocked) {
      setState("error", "Microfone indisponível");
      return;
    }
    setState("reconnecting", "Conectando microfone…");
    startRecognition();
  }

  // Erro: vibra, mostra em vermelho e avisa por voz
  function fail(message) {
    buzz([120, 80, 120]);
    setState("error", "Atenção");
    return speak(message);
  }

  /* ================= CÂMERA ================= */
  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStatus("Câmera indisponível: abra esta página por HTTPS ou localhost.");
      return false;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      stream.getVideoTracks().forEach((track) => {
        track.addEventListener("ended", () => {
          clearEnvironmentScan();
          stream = null;
          video.srcObject = null;
          showStatus("A câmera foi desconectada. Reconecte-a e recarregue a página para retomar a leitura automática.");
        }, { once: true });
      });
      video.srcObject = stream;
      await video.play();
      return true;
    } catch (e) {
      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
        stream = null;
        video.srcObject = null;
      }
      const msgs = {
        NotAllowedError: "A câmera foi bloqueada. Permita o acesso à câmera e recarregue a página.",
        NotFoundError: "Não encontrei nenhuma câmera neste aparelho.",
        NotReadableError: "A câmera está sendo usada por outro aplicativo. Feche-o e tente de novo."
      };
      showStatus("Erro na câmera: " + (msgs[e.name] || e.message));
      return false;
    }
  }

  // Foto reduzida: mantém boa qualidade sem pesar na rede
  function takePhoto() {
    if (!stream || !video.videoWidth) return null;
    const vw = video.videoWidth, vh = video.videoHeight;
    const scale = Math.min(1, CONFIG.imageMaxSide / Math.max(vw, vh));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(vw * scale);
    canvas.height = Math.round(vh * scale);
    const context = canvas.getContext("2d");
    if (!context) return null;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg", CONFIG.imageQuality);
  }

  function clearEnvironmentScan() {
    clearTimeout(environmentScanTimer);
    environmentScanTimer = null;
  }

  function scheduleEnvironmentScan(delay = CONFIG.environmentScanIntervalMs) {
    clearEnvironmentScan();
    if (!systemOn || !stream || document.visibilityState !== "visible") return;

    environmentScanTimer = setTimeout(async () => {
      environmentScanTimer = null;
      if (!systemOn || !stream || document.visibilityState !== "visible") return;
      if (busy) {
        scheduleEnvironmentScan(10000);
        return;
      }
      try {
        await processCommand(
          "Descreva brevemente o ambiente visível à minha frente.",
          true,
          true
        );
      } finally {
        scheduleEnvironmentScan();
      }
    }, delay);
  }

  /* ================= API (lógica original) ================= */
  async function processCommand(question, requireImage = false, automatic = false) {
    if (busy) return;
    const requestId = createRequestId();
    busy = true;
    stopRecognition();
    buzz(60);
    setState("thinking", "Pensando…");
    showStatus("Preparando a solicitação… Pergunta: “" + question + "”");

    let photo;
    const captureStartedAt = performance.now();
    setMascotState("observing");
    try {
      photo = takePhoto();
    } catch {
      photo = null;
    } finally {
      setMascotState("thinking");
    }
    if (photo) setMascotState("observing");
    console.info("[B.E.A. performance]", {
      request_id: requestId,
      stage: "capture_prepare",
      duration_ms: Number((performance.now() - captureStartedAt).toFixed(2))
    });
    if (!photo && requireImage) {
      if (automatic) {
        setState("error", "Câmera indisponível");
        showStatus("Não consegui capturar a imagem para a leitura automática. Confira a câmera.");
        resumeListening();
        showMascotErrorMoment();
      } else {
        await fail("Não consegui capturar uma imagem. Verifique a câmera e tente novamente.");
      }
      return;
    }
    if (!photo) {
      showStatus("Enviando pergunta sem imagem… Pergunta: “" + question + "”");
    } else {
      showStatus("Analisando a imagem… Pergunta: “" + question + "”");
    }

    if (!navigator.onLine) {
      if (automatic) {
        setState("error", "Sem conexão");
        showStatus("Leitura automática pausada: confira a conexão com a internet.");
        resumeListening();
        showMascotErrorMoment();
      } else {
        await fail("Estou sem internet. Verifique a conexão do celular.");
      }
      return;
    }

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), CONFIG.apiTimeoutMs);
    const requestStartedAt = performance.now();
    const requestMode = assistantMode;
    let responseStatus = null;
    let serverRequestId = null;
    let responseArrivedAt = null;
    let apiRoundTripLogged = false;
    const logApiRoundTrip = () => {
      if (apiRoundTripLogged) return;
      apiRoundTripLogged = true;
      console.info("[B.E.A. performance]", {
        request_id: requestId,
        server_request_id: serverRequestId,
        stage: "api_round_trip",
        status: responseStatus,
        duration_ms: Number((performance.now() - requestStartedAt).toFixed(2))
      });
    };

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        signal: controller.signal,
        headers: {
          "Content-Type": "application/json",
          "X-Request-ID": requestId
        },
        body: JSON.stringify({
          assistant_mode: requestMode,
          messages: [
            {
              role: "user",
              content: [
                { type: "text", text: question },
                ...(photo ? [{ type: "image_url", image_url: { url: photo } }] : [])
              ]
            }
          ]
        })
      });

      responseStatus = response.status;
      serverRequestId = response.headers.get("X-Request-ID");
      const responseText = await response.text();
      responseArrivedAt = performance.now();
      logApiRoundTrip();
      let data;
      try {
        data = JSON.parse(responseText);
      } catch {
        const error = new Error("O servidor respondeu em um formato inesperado.");
        error.status = response.status;
        error.code = "invalid_server_response";
        throw error;
      }
      if (!response.ok) {
        const error = new Error(
          typeof data.error === "string" ? data.error : "O servidor recusou a solicitação."
        );
        error.status = response.status;
        error.code = typeof data.code === "string" ? data.code : "http_error";
        throw error;
      }

      const answer = data && data.choices && data.choices[0] &&
        data.choices[0].message && data.choices[0].message.content;
      if (typeof answer !== "string" || !answer.trim()) {
        const error = new Error("A resposta do servidor não contém texto.");
        error.status = response.status;
        error.code = "invalid_server_response";
        throw error;
      }
      let voiceStartObserved = false;
      buzz([40, 40, 40]);
      await speak(answer, () => {
        if (voiceStartObserved) return;
        voiceStartObserved = true;
        console.info("[B.E.A. performance]", {
          request_id: requestId,
          server_request_id: serverRequestId,
          stage: "response_to_voice_start",
          duration_ms: Number((performance.now() - responseArrivedAt).toFixed(2))
        });
      }, showMascotHappyMoment, requestMode);
      if (!voiceStartObserved) {
        console.info("[B.E.A. performance]", {
          request_id: requestId,
          server_request_id: serverRequestId,
          stage: "response_to_voice_start",
          duration_ms: null,
          observed: false
        });
      }

    } catch (error) {
      const code = error.code || "network_error";
      console.warn("Falha na solicitação B.E.A.", {
        status: error.status || null,
        code,
        name: error.name || "Error"
      });
      let msg = "Ocorreu um erro inesperado. Tente novamente.";
      if (error.name === "AbortError") msg = "A solicitação demorou demais. Tente novamente.";
      else if (error instanceof TypeError) msg = "Não consegui alcançar o servidor da B.E.A. Verifique se o site está disponível e tente novamente.";
      else if (code === "api_key_missing") msg = "A integração de IA não está configurada no servidor.";
      else if (code === "model_configuration_error") msg = "O modelo de IA não está configurado corretamente no servidor.";
      else if (code === "provider_authentication") msg = "A OpenRouter recusou a credencial configurada. O administrador precisa conferir a chave no Render.";
      else if (code === "provider_credits") msg = "A conta da OpenRouter está sem créditos disponíveis.";
      else if (code === "provider_model_not_found") msg = "O modelo configurado não foi encontrado na OpenRouter. O administrador precisa conferir OPENROUTER_MODEL no Render.";
      else if (code === "provider_rate_limited" || code === "request_rate_limited") msg = error.message;
      else if (code === "provider_timeout" || code === "provider_unavailable") msg = error.message;
      else if (code === "provider_request_rejected" || code === "provider_unsupported_input") msg = error.message;
      else if (code === "provider_invalid_response" || code === "provider_empty_response" ||
        code === "provider_no_answer" || code === "provider_incomplete_response" ||
        code === "provider_content_filtered") msg = error.message;
      else if (code === "request_too_large") msg = error.message;
      else if (code === "invalid_request" || code === "invalid_json" || code === "invalid_content_type") msg = error.message;
      else if (code === "invalid_server_response") msg = "O servidor respondeu em um formato inesperado. Tente novamente mais tarde.";
      else if (error.status >= 500) msg = "O servidor da B.E.A. está com um problema temporário. Tente novamente mais tarde.";
      else if (error.status) msg = error.message;
      if (automatic) {
        setState("error", "Falha na leitura");
        showStatus("Não consegui concluir a leitura automática. " + msg);
        resumeListening();
        showMascotErrorMoment();
      } else {
        await fail(msg);
      }
    } finally {
      clearTimeout(timeout);
      logApiRoundTrip();
    }
  }

  /* ================= TELA SEMPRE LIGADA ================= */
  async function keepAwake() {
    try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => {
    updateMascotMotion();
    if (document.hidden) {
      clearTimeout(mascotSpeechTimer);
      clearTimeout(speechBoundaryTimer);
      mascotSpeechTimer = null;
      speechBoundaryTimer = null;
      if (mascot.dataset.mascotState === "speaking") mascot.dataset.mouth = "closed";
    } else if (mascot.dataset.mascotState === "speaking" &&
      mascot.dataset.speechBoundaries !== "true" && activeMascotSpeechText) {
      if (mascotSpeechSequenceToken === speakToken) scheduleFallbackMouth(speakToken);
      else startFallbackMouth(activeMascotSpeechText, speakToken);
    }
    if (document.visibilityState === "visible" && systemOn) {
      keepAwake();
      if (stream && !environmentScanTimer) scheduleEnvironmentScan();
    } else {
      clearEnvironmentScan();
    }
  });
  window.addEventListener("pagehide", () => {
    systemOn = false;
    clearTimeout(restartTimer);
    clearEnvironmentScan();
    clearTimeout(mascotBlinkTimer);
    clearTimeout(mascotBlinkReleaseTimer);
    clearTimeout(mascotSecondBlinkTimer);
    clearTimeout(mascotGazeTimer);
    clearTimeout(mascotGazeResetTimer);
    clearTimeout(mascotGestureTimer);
    clearTimeout(mascotGestureReleaseTimer);
    clearTimeout(mascotMicroTimer);
    clearTimeout(mascotMicroResetTimer);
    clearTimeout(mascotEmotionTimer);
    clearTimeout(speechBoundaryTimer);
    mascot.classList.remove("is-gesturing");
    if (recognition) {
      try { recognition.abort(); } catch (e) {}
    }
    recognitionRunning = false;
    recognitionStarting = false;
    if (stream) stream.getTracks().forEach((track) => track.stop());
    video.srcObject = null;
    stopSpeaking();
  });

  /* ================= BOTÕES ================= */
  startBtn.addEventListener("click", async () => {
    startBtn.disabled = true;
    unlockAudio(); // precisa acontecer dentro do toque do usuário
    setState("thinking", "Ativando…");
    showStatus("Ativando câmera e microfone. Aceite as permissões se o celular pedir.");
    systemOn = true;

    const cameraOk = await startCamera();
    keepAwake();

    startBtn.hidden = true;
    muteMicBtn.hidden = false;
    updateMicButton();
    hint.hidden = false;

    if (cameraOk) {
      await speak("Olá! Sou a Bia. Já estou ouvindo. Diga 'Bia' e faça seu pedido.");
    } else {
      await speak("Olá! Sou a Bia e já estou ouvindo. Estou sem câmera; a leitura automática do ambiente não está disponível.");
    }
    if (cameraOk) scheduleEnvironmentScan(CONFIG.firstEnvironmentScanMs);
  });

  muteMicBtn.addEventListener("click", () => {
    if (!systemOn) return;
    micMuted = !micMuted;
    updateMicButton();
    if (micMuted) {
      stopRecognition();
      if (!busy) setState("muted", "Microfone silenciado");
      showStatus("Microfone silenciado. A Bia não ouvirá comandos até você reativá-lo.");
      return;
    }
    showStatus(busy
      ? "Microfone reativado. A escuta retornará quando a Bia terminar de responder."
      : "Microfone reativado. Diga “Bia” e faça seu pedido.");
    if (!busy) resumeListening();
  });

  modeToggle.addEventListener("click", () => {
    setAssistantMode(
      assistantMode === ASSISTANT_MODES.BIA
        ? ASSISTANT_MODES.JARVIS
        : ASSISTANT_MODES.BIA
    );
  });
})();
</script>
