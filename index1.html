<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4F0">
<title>B.E.A · Assistente de Visão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  :root {
    color-scheme: light;
    --color-lavender: #BFBBDD;
    --color-lavender-deep: #777392;
    --color-lavender-soft: #F0EFF6;
    --color-peach: #F3BB84;
    --color-peach-deep: #85552F;
    --color-peach-vivid: #E77F32;
    --color-peach-soft: #FFF1E2;
    --color-cream: #F7F4F0;
    --color-surface: #FFFEFC;
    --color-ink: #373544;
    --color-muted: #716F7A;
    --color-line: #E7E2DC;
    --color-camera: #292833;
    --color-overlay: #FFFEFC;
    --color-overlay-border: rgba(255, 254, 252, .82);
    --color-overlay-border-soft: rgba(255, 254, 252, .35);
    --color-overlay-glass: rgba(255, 254, 252, .94);
    --color-camera-glass: rgba(41, 40, 51, .72);
    --color-lavender-hover: #C9C6E2;
    --color-error: #A44750;
    --color-error-soft: #F8E9E9;
    --shadow-panel: 0 18px 55px rgba(55, 53, 68, .07);
    --shadow-camera: 0 8px 24px rgba(55, 53, 68, .08);
    --shadow-scan: 0 0 12px rgba(243, 187, 132, .7);
    --shadow-lavender: 0 4px 0 rgba(119, 115, 146, .18);
    --shadow-lavender-hover: 0 6px 12px rgba(119, 115, 146, .16);
    --accent: var(--color-lavender-deep);
  }

  body[data-state="off"],
  body[data-state="muted"] { --accent: var(--color-lavender-deep); }
  body[data-state="listening"],
  body[data-state="thinking"] { --accent: var(--color-lavender-deep); }
  body[data-state="reconnecting"],
  body[data-state="speaking"] { --accent: var(--color-peach-deep); }
  body[data-state="error"] { --accent: var(--color-error); }

  body {
    background: var(--color-cream);
    color: var(--color-ink);
    font-family: 'Nunito Sans', 'Trebuchet MS', system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  }

  .hud {
    width: 100%;
    max-width: 1000px;
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    border-radius: 32px;
    padding: clamp(24px, 5vw, 48px);
    display: grid;
    grid-template-columns: minmax(0, 1.08fr) minmax(280px, .92fr);
    grid-template-areas:
      "header header"
      "video indicator"
      "video mascot"
      "video status"
      "video hint"
      "video controls";
    align-items: center;
    column-gap: clamp(28px, 5vw, 56px);
    row-gap: 18px;
    box-shadow: var(--shadow-panel);
  }

  .header { grid-area: header; text-align: center; padding-bottom: 8px; }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2.5vw, 18px);
  }
  .brand-logo {
    display: block;
    width: clamp(116px, 15vw, 156px);
    max-width: 48%;
    height: auto;
    flex: 0 1 auto;
    object-fit: contain;
  }
  h1 {
    color: var(--color-ink);
    font-size: clamp(34px, 6vw, 48px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: .16em;
    padding-left: .16em;
  }
  .subtitle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    padding: 6px 13px;
    border: 1px solid var(--color-line);
    border-radius: 999px;
    background: var(--color-cream);
    color: var(--color-muted);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .subtitle::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--color-peach-vivid);
  }

  .video-wrapper {
    grid-area: video;
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 24px;
    overflow: hidden;
    background: var(--color-camera);
    border: 1px solid var(--color-line);
    box-shadow: var(--shadow-camera);
  }
  video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: filter .25s ease;
  }
  body[data-state="thinking"] video { filter: brightness(.88) saturate(.9); }

  .corner {
    position: absolute;
    width: 24px;
    height: 24px;
    border: 2px solid var(--color-overlay-border);
    transition: border-color .2s ease;
  }
  .corner.tl { top: 14px; left: 14px; border-right: 0; border-bottom: 0; border-top-left-radius: 9px; }
  .corner.tr { top: 14px; right: 14px; border-left: 0; border-bottom: 0; border-top-right-radius: 9px; }
  .corner.bl { bottom: 14px; left: 14px; border-right: 0; border-top: 0; border-bottom-left-radius: 9px; }
  .corner.br { bottom: 14px; right: 14px; border-left: 0; border-top: 0; border-bottom-right-radius: 9px; }

  .tag {
    position: absolute;
    top: 14px;
    left: 48px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 11px;
    border: 1px solid var(--color-overlay-border-soft);
    border-radius: 999px;
    background: var(--color-camera-glass);
    color: var(--color-overlay);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .1em;
  }
  .tag i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--color-peach-vivid);
    animation: breathe 1.8s ease-in-out infinite;
  }

  .scan {
    position: absolute;
    z-index: 1;
    left: 10%;
    right: 10%;
    top: 0;
    height: 2px;
    border-radius: 50%;
    background: var(--color-peach);
    box-shadow: var(--shadow-scan);
    opacity: 0;
    pointer-events: none;
  }
  body[data-state="thinking"] .scan { opacity: 1; animation: scan 2.4s ease-in-out infinite; }

  .thinking-label {
    position: absolute;
    inset: auto 0 16px;
    width: max-content;
    max-width: calc(100% - 32px);
    margin: auto;
    padding: 8px 13px;
    border-radius: 999px;
    background: var(--color-overlay-glass);
    color: var(--color-ink);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .08em;
    opacity: 0;
  }
  body[data-state="thinking"] .thinking-label { opacity: 1; }

  .indicator {
    grid-area: indicator;
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }
  .orb {
    position: relative; flex: 0 0 64px; width: 64px; height: 64px;
    display: grid; place-items: center;
  }
  .orb .core {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--color-lavender);
    box-shadow: 0 0 0 8px var(--color-lavender-soft);
    transition: background .2s ease, box-shadow .2s ease;
  }
  .orb .ring {
    position: absolute; inset: 6px; border-radius: 50%;
    border: 2px solid var(--accent); opacity: 0;
  }
  .orb .bars { display: none; gap: 4px; align-items: center; height: 34px; }
  .orb .bars i { width: 5px; height: 8px; border-radius: 3px; background: var(--color-peach-deep); animation: eq .8s ease-in-out infinite; }
  .orb .bars i:nth-child(2) { animation-delay: .15s; }
  .orb .bars i:nth-child(3) { animation-delay: .30s; }
  .orb .bars i:nth-child(4) { animation-delay: .10s; }
  .orb .bars i:nth-child(5) { animation-delay: .25s; }

  body[data-state="listening"] .ring { animation: ripple 1.8s ease-out infinite; }
  body[data-state="listening"] .ring.r2 { animation-delay: .9s; }
  body[data-state="listening"] .core { animation: breathe 1.8s ease-in-out infinite; background: var(--color-lavender-deep); box-shadow: 0 0 0 8px var(--color-lavender-soft); }
  body[data-state="thinking"] .ring.r1 {
    opacity: 1; border-color: transparent; border-top-color: var(--accent); border-right-color: var(--accent);
    animation: spin 1.4s linear infinite; inset: 2px;
  }
  body[data-state="speaking"] .core { display: none; }
  body[data-state="speaking"] .bars { display: flex; }
  body[data-state="error"] .core { background: var(--color-error); box-shadow: 0 0 0 8px var(--color-error-soft); }

  .mascot-stage {
    grid-area: mascot;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-width: 0;
    min-height: 148px;
    pointer-events: none;
  }
  .mascot-illustration {
    display: block;
    flex: 0 1 auto;
    width: clamp(128px, 16vw, 156px);
    max-width: 54%;
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 5px 5px rgba(55, 53, 68, .08));
  }
  .mascot-skin { fill: #F2D2B7; }
  .mascot-hair { fill: #E9BE68; }
  .mascot-shirt { fill: var(--color-lavender); }
  .mascot-ink { fill: var(--color-ink); }
  .mascot-highlight { fill: var(--color-surface); }
  .mascot-accent { fill: var(--color-peach); }
  .mascot-blush { fill: #EBAF9F; opacity: .32; }
  .mascot-arm-left,
  .mascot-arm-right,
  .mascot-head,
  .mascot-torso,
  .mascot-eyes,
  .mascot-brow,
  .mascot-mouth-open,
  .mascot-mouth-smile,
  .mascot-mouth-closed {
    transform-box: fill-box;
    transform-origin: center;
  }
  .mascot-torso,
  .mascot-head,
  .mascot-pupils,
  .mascot-eyes { transition: transform .4s cubic-bezier(.2,.75,.25,1); }
  .mascot-torso { animation: mascot-breathe 4.6s ease-in-out infinite; }
  .mascot-eyes.is-blinking { animation: mascot-blink 145ms ease-in-out; }
  .mascot-brow { transition: transform .3s cubic-bezier(.2,.75,.25,1); }
  .mascot-mouth-smile { display: inline; }
  .mascot-mouth-open,
  .mascot-mouth-wide,
  .mascot-mouth-round,
  .mascot-mouth-closed { display: none; }
  .mascot-arm-left,
  .mascot-arm-right { transform-box: fill-box; transform-origin: center 12%; transition: transform .45s cubic-bezier(.2,.75,.25,1); }
  #biaMascot[data-gaze="left"] .mascot-pupils { transform: translateX(-1.6px); }
  #biaMascot[data-gaze="right"] .mascot-pupils { transform: translateX(1.6px); }
  #biaMascot[data-mascot-state="listening"] .mascot-head { transform: rotate(-3deg) translateY(-1px); }
  #biaMascot[data-mascot-state="listening"] .mascot-brow-left { transform: translateY(-2px) rotate(-4deg); }
  #biaMascot[data-mascot-state="listening"] .mascot-brow-right { transform: translateY(-2px) rotate(4deg); }
  #biaMascot[data-mascot-state="thinking"] .mascot-head { transform: rotate(-4deg) translateY(-1px); }
  #biaMascot[data-mascot-state="thinking"] .mascot-brow-left { transform: translateY(-1px) rotate(5deg); }
  #biaMascot[data-mascot-state="thinking"] .mascot-brow-right { transform: translateY(-3px) rotate(-6deg); }
  #biaMascot[data-mascot-state="observing"] .mascot-head { transform: rotate(2deg); }
  #biaMascot[data-mascot-state="observing"] .mascot-brow { transform: translateY(-2px); }
  #biaMascot[data-mascot-state="speaking"] .mascot-mouth-smile { display: none; }
  #biaMascot[data-mascot-state="speaking"][data-speech-boundaries="false"] .mascot-mouth-open {
    display: inline;
    animation: mascot-mouth 680ms ease-in-out infinite alternate;
  }
  #biaMascot[data-mascot-state="speaking"][data-speech-boundaries="true"] .mascot-mouth-closed { display: inline; }
  #biaMascot[data-mascot-state="speaking"][data-speech-boundaries="true"][data-mouth="open"] .mascot-mouth-closed,
  #biaMascot[data-mascot-state="speaking"][data-speech-boundaries="true"][data-mouth="wide"] .mascot-mouth-closed,
  #biaMascot[data-mascot-state="speaking"][data-speech-boundaries="true"][data-mouth="round"] .mascot-mouth-closed { display: none; }
  #biaMascot[data-mascot-state="speaking"][data-speech-boundaries="true"][data-mouth="open"] .mascot-mouth-open { display: inline; }
  #biaMascot[data-mascot-state="speaking"][data-speech-boundaries="true"][data-mouth="wide"] .mascot-mouth-wide { display: inline; }
  #biaMascot[data-mascot-state="speaking"][data-speech-boundaries="true"][data-mouth="round"] .mascot-mouth-round { display: inline; }
  #biaMascot.is-gesturing .mascot-head { transform: translateY(-1px) rotate(1deg); }
  #biaMascot.is-gesturing .mascot-arm-right { transform: rotate(-8deg) translateY(-2px); }
  #biaMascot.is-gesturing .mascot-arm-left { transform: rotate(5deg) translateY(-1px); }
  #biaMascot[data-mascot-state="speaking"] .mascot-torso { animation-duration: 2.6s; }
  #biaMascot[data-mascot-state="happy"] .mascot-brow { transform: translateY(-2px); }
  #biaMascot[data-mascot-state="happy"] .mascot-mouth-smile { stroke-width: 3.5; }
  #biaMascot[data-mascot-state="happy"] .mascot-head { transform: translateY(-2px); }
  #biaMascot[data-mascot-state="error"] .mascot-brow-left { transform: rotate(6deg); }
  #biaMascot[data-mascot-state="error"] .mascot-brow-right { transform: rotate(-6deg); }
  #biaMascot[data-mascot-state="error"] .mascot-head { transform: rotate(-2deg); }

  #stateLabel {
    color: var(--accent);
    font-size: 16px;
    font-weight: 800;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }

  #status {
    grid-area: status;
    background: var(--color-cream);
    border: 1px solid var(--color-line);
    border-left: 4px solid var(--color-lavender);
    border-radius: 18px;
    padding: 17px 19px;
    min-height: 94px;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.55;
    color: var(--color-ink);
    display: flex;
    align-items: center;
    word-break: break-word;
    transition: background-color .2s ease, border-color .2s ease;
  }
  body[data-state="listening"] #status { background: var(--color-lavender-soft); border-left-color: var(--color-lavender-deep); }
  body[data-state="thinking"] #status { background: var(--color-lavender-soft); border-left-color: var(--color-lavender-deep); }
  body[data-state="reconnecting"] #status,
  body[data-state="speaking"] #status { background: var(--color-peach-soft); border-left-color: var(--color-peach-deep); }
  body[data-state="error"] #status { background: var(--color-error-soft); border-left-color: var(--color-error); }
  body[data-state="muted"] #status { border-left-color: var(--color-peach); }
  #status:focus-visible, .btn:focus-visible { outline: 3px solid var(--color-lavender-deep); outline-offset: 3px; }
  .hint {
    grid-area: hint;
    color: var(--color-muted);
    font-size: 13px;
    line-height: 1.5;
    text-align: center;
  }

  .controls { grid-area: controls; display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .btn {
    width: 100%;
    min-height: 58px;
    border: 1px solid transparent;
    border-radius: 16px;
    font: inherit;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: transform .16s ease, background-color .16s ease, box-shadow .16s ease;
    padding: 13px 18px;
  }
  .btn-main {
    background: var(--color-lavender);
    color: var(--color-ink);
    box-shadow: var(--shadow-lavender);
  }
  .btn-main::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    margin: 0 10px 1px 0;
    border-radius: 50%;
    background: var(--color-peach-deep);
  }
  .btn-main:hover:not(:disabled) { background: var(--color-lavender-hover); box-shadow: var(--shadow-lavender-hover); }
  .btn-alt {
    background: var(--color-surface);
    border-color: var(--color-line);
    color: var(--color-ink);
  }
  .btn-alt:hover:not(:disabled) { background: var(--color-peach-soft); border-color: var(--color-peach); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled {
    background: var(--color-cream);
    border-color: var(--color-line);
    color: var(--color-muted);
    cursor: not-allowed;
    box-shadow: none;
  }

  @keyframes scan    { 0% { top: 8%; } 50% { top: 92%; } 100% { top: 8%; } }
  @keyframes spin    { to { transform: rotate(360deg); } }
  @keyframes ripple  { 0% { transform: scale(.55); opacity: .7; } 100% { transform: scale(1.3); opacity: 0; } }
  @keyframes breathe { 50% { transform: scale(1.12); } }
  @keyframes eq      { 0%, 100% { height: 8px; } 50% { height: 28px; } }
  @keyframes mascot-breathe { 50% { transform: translateY(-1.5px) scale(1.005); } }
  @keyframes mascot-blink { 50% { transform: scaleY(.08); } }
  @keyframes mascot-mouth { to { transform: scaleY(.58) scaleX(1.1); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
    }
    .mascot-torso { animation: none !important; }
  }
  @media (max-width: 760px) {
    body { align-items: flex-start; padding-right: 14px; padding-left: 14px; }
    .hud {
      max-width: 520px;
      margin: auto;
      padding: clamp(20px, 6vw, 30px);
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "header"
        "video"
        "indicator"
        "mascot"
        "status"
        "hint"
        "controls";
      row-gap: 16px;
      border-radius: 26px;
    }
    .header { padding-bottom: 2px; }
    .video-wrapper { aspect-ratio: 4 / 3; }
    #status { min-height: 82px; }
    .mascot-stage { min-height: 136px; }
    .mascot-illustration { width: clamp(116px, 34vw, 140px); }
  }
  @media (max-height: 640px) and (min-width: 761px) {
    body { align-items: flex-start; }
    .hud { margin: auto; }
    .video-wrapper { aspect-ratio: 16 / 10; }
  }
</style>
</head>

<body data-state="off">
<main class="hud">

  <header class="header">
    <div class="brand">
      <img class="brand-logo" src="static/bia-logo.jpg" alt="Logo da B.E.A., com as letras bea em lavanda, azul claro e pêssego">

    <div class="subtitle">Assistente de visão · Acessibilidade</div>

  <div class="video-wrapper">

    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <div class="tag"><i></i>VISÃO</div>
    <div class="scan"></div>
    <div class="thinking-label">ANALISANDO…</div>

  <div class="indicator" aria-hidden="true">
    <div class="orb">
      <span class="ring r1"></span><span class="ring r2"></span>
      <span class="core"></span>
      <span class="bars"><i></i><i></i><i></i><i></i><i></i></span>
    </div>
    <div id="stateLabel">Sistema desligado</div>
  </div>

  <figure

      <ellipse cx="91" cy="158" rx="53" ry="7" fill="#373544" opacity=".08"/>

      </g>
      <g id="bia-torso" class="mascot-torso">
        <path class="mascot-shirt" d="M65 91c-12 2-19 9-22 22l-5 44c17 5 34 7 53 7s36-2 53-7l-5-44c-3-13-10-20-22-22l-11-5H76z"/>
        <path d="M77 89c2 10 7 15 14 15s12-5 14-15l-6-5H83z" fill="#E7D9E8"/>
        <path class="mascot-accent" d="m88 105 3 4 3-4 3 27-6 6-6-6z"/>
      </g>
      <g id="bia-head" class="mascot-head">
        <circle class="mascot-hair" cx="124" cy="27" r="14"/>
        <circle cx="124" cy="27" r="7" fill="#D5A94F"/>
        <path class="mascot-hair" d="M59 48c0-22 14-36 33-36 20 0 33 14 33 36v25H59z"/>
        <path class="mascot-skin" d="M62 49c0-19 12-31 30-31s30 12 30 31v21c0 20-13 34-30 34S62 90 62 70z"/>
        <path class="mascot-hair" d="M58 55c-3-22 9-39 28-44 19-5 39 3 46 21-9-1-17-6-22-13-10 9-25 13-44 11l-7 27z"/>
        <path class="mascot-blush" d="M66 78c4-4 10-4 14 0-3 4-10 5-14 0zm37 0c4-4 10-4 14 0-3 4-10 5-14 0z"/>
        <g class="mascot-brow mascot-brow-left"><path d="M72 54c4-2.5 9-2.5 13 0" fill="none" stroke="#8A684D" stroke-width="1.8" stroke-linecap="round"/></g>
        <g class="mascot-brow mascot-brow-right"><path d="M99 54c4-2.5 9-2.5 13 0" fill="none" stroke="#8A684D" stroke-width="1.8" stroke-linecap="round"/></g>
        <g class="mascot-eyes">
          <g class="mascot-pupils">
            <ellipse class="mascot-ink" cx="80" cy="66" rx="6.4" ry="8.4"/>
            <ellipse class="mascot-ink" cx="105" cy="66" rx="6.4" ry="8.4"/>
            <circle class="mascot-highlight" cx="82" cy="63" r="2.1"/>
            <circle class="mascot-highlight" cx="107" cy="63" r="2.1"/>
            <circle class="mascot-highlight" cx="78" cy="68" r=".9"/>
            <circle class="mascot-highlight" cx="103" cy="68" r=".9"/>
          </g>
        </g>
        <path d="M91 72c-.8 3-1.4 5-1 6 .8 1 2.2 1 3 0" fill="none" stroke="#D8A887" stroke-width="1.6" stroke-linecap="round"/>
        <path class="mascot-mouth-smile" d="M84 85c4 6 12 6 16 0" fill="none" stroke="#9E5860" stroke-width="2.7" stroke-linecap="round"/>
        <path class="mascot-mouth-closed" d="M88 87h7" fill="none" stroke="#9E5860" stroke-width="2.5" stroke-linecap="round"/>
        <ellipse class="mascot-mouth-open" cx="91.5" cy="87" rx="5.5" ry="4.5" fill="#9E5860"/>
        <path class="mascot-mouth-wide" d="M85 85c4 2 9 2 13 0v5c-3 4-10 4-13 0z" fill="#9E5860"/>
        <ellipse class="mascot-mouth-round" cx="91.5" cy="87" rx="3.3" ry="5.2" fill="#9E5860"/>
      </g>
    </svg>
  </figure>

  <div id="status" role="status" aria-live="polite">
    Toque em “Ativar B.E.A.” para conceder as permissões e iniciar.
  </div>
  <div class="hint" id="hint" hidden>Diga “Bia” e faça seu pedido. A cena também é analisada automaticamente.</div>

  <div class="controls">
    <button id="startSystem" class="btn btn-main">Ativar B.E.A.</button>
    <button id="muteMic" class="btn btn-alt" type="button" aria-pressed="false" hidden>
      🎙️ Microfone ligado — toque para silenciar
    </button>
  </div>

</main>

<script>
(() => {
  "use strict";

  /* ================= CONFIGURAÇÃO ================= */
  const CONFIG = {
    imageMaxSide: 1024,              // maior lado da foto enviada (px)
    imageQuality: 0.75,              // qualidade JPEG (0 a 1)
    apiTimeoutMs: 55000,
    firstEnvironmentScanMs: 15000,
    environmentScanIntervalMs: 60000,
    recognitionRestartMs: 700
  };
  const SYSTEM_PROMPT =
    "Você é a BEA, assistente de voz feminina estilo JARVIS para óculos de acessibilidade. " +
    "Responda de forma extremamente curta, direta e natural em Português do Brasil para leitura em voz alta.";
  const WAKE_ONE = /\b(bia|bea|via)\b/;
  const WAKE_ALL = /\b(bia|bea|via)\b/g;

  /* ================= ELEMENTOS ================= */
  const $ = (id) => document.getElementById(id);
  const video = $("video"), statusEl = $("status"), stateLabel = $("stateLabel");
  const mascot = $("biaMascot");
  const startBtn = $("startSystem"), muteMicBtn = $("muteMic"), hint = $("hint");
  const MASCOT_APP_STATES = {
    off: "idle",
    muted: "idle",
    listening: "listening",
    thinking: "thinking",
    speaking: "idle",
    reconnecting: "idle",
    error: "error"
  };

  /* ================= ESTADO ================= */
  let stream = null, recognition = null, wakeLock = null;
  let systemOn = false;       // sistema iniciado
  let busy = false;           // processando ou falando (reconhecimento pausado)
  let micBlocked = false;     // permissão de microfone negada
  let micMuted = false;
  let recognitionRunning = false, recognitionStarting = false;
  let restartTimer = null;
  let environmentScanTimer = null;
  const reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
  let mascotBlinkTimer = null, mascotGazeTimer = null, mascotGestureTimer = null;

  function setState(state, label) {
    document.body.dataset.state = state;
    stateLabel.textContent = label;
    if (MASCOT_APP_STATES[state]) setMascotState(MASCOT_APP_STATES[state]);
  }
  function showStatus(text) { statusEl.textContent = text; }
  function buzz(pattern) { try { navigator.vibrate && navigator.vibrate(pattern); } catch (e) {} }
  function createRequestId() {
    const bytes = new Uint8Array(16);
    if (window.crypto && window.crypto.getRandomValues) {
      window.crypto.getRandomValues(bytes);
    } else {
      for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
    }
    bytes[6] = (bytes[6] & 0x0f) | 0x40;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    const hex = Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
    return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
  }
  function updateMicButton() {
    const unavailable = !SR || micBlocked;
    muteMicBtn.disabled = unavailable;
    muteMicBtn.setAttribute("aria-pressed", String(micMuted));
    muteMicBtn.textContent = unavailable
      ? "🎙️ Microfone indisponível — confira as permissões"
      : micMuted
        ? "🔇 Microfone silenciado — toque para reativar"
        : "🎙️ Microfone ligado — toque para silenciar";
  }

  /* ================= VOZ (TEXT-TO-SPEECH) ================= */
  const hasTTS = "speechSynthesis" in window;
  let voices = [];
  let speakToken = 0, keepAlive = null, watchdog = null, speechStartTimer = null;
  let activeSpeechResolve = null;
  let mascotEmotionTimer = null, speechBoundaryTimer = null;

  const randomDelay = (minimum, maximum) =>
    Math.round(minimum + Math.random() * (maximum - minimum));

  function scheduleMascotBlink() {
    clearTimeout(mascotBlinkTimer);
    const state = mascot.dataset.mascotState;
    if (reducedMotionQuery.matches || document.hidden ||
      !["idle", "listening", "thinking", "observing"].includes(state)) return;

    mascotBlinkTimer = setTimeout(() => {
      const eyes = mascot.querySelector(".mascot-eyes");
      eyes.classList.remove("is-blinking");
      void eyes.getBoundingClientRect();
      eyes.classList.add("is-blinking");
      setTimeout(() => eyes.classList.remove("is-blinking"), 180);

      if (Math.random() < 0.12) {
        mascotBlinkTimer = setTimeout(() => {
          eyes.classList.remove("is-blinking");
          void eyes.getBoundingClientRect();
          eyes.classList.add("is-blinking");
          setTimeout(() => eyes.classList.remove("is-blinking"), 180);
          scheduleMascotBlink();
        }, 190);
      } else {
        scheduleMascotBlink();
      }
    }, randomDelay(2600, 5700));
  }

  function scheduleMascotGaze() {
    clearTimeout(mascotGazeTimer);
    if (reducedMotionQuery.matches || document.hidden ||
      mascot.dataset.mascotState !== "idle") return;

    mascotGazeTimer = setTimeout(() => {
      const gaze = Math.random() < 0.5 ? "left" : "right";
      mascot.dataset.gaze = gaze;
      setTimeout(() => {
        if (mascot.dataset.mascotState === "idle") mascot.dataset.gaze = "center";
      }, randomDelay(450, 900));
      scheduleMascotGaze();
    }, randomDelay(3200, 6800));
  }

  function scheduleMascotGesture() {
    clearTimeout(mascotGestureTimer);
    if (reducedMotionQuery.matches || document.hidden ||
      mascot.dataset.mascotState !== "speaking") return;

    mascotGestureTimer = setTimeout(() => {
      mascot.classList.add("is-gesturing");
      setTimeout(() => mascot.classList.remove("is-gesturing"), randomDelay(380, 620));
      scheduleMascotGesture();
    }, randomDelay(1200, 2600));
  }

  function updateMascotMotion() {
    clearTimeout(mascotBlinkTimer);
    clearTimeout(mascotGazeTimer);
    clearTimeout(mascotGestureTimer);
    mascot.querySelector(".mascot-eyes").classList.remove("is-blinking");
    mascot.dataset.gaze = "center";
    mascot.classList.remove("is-gesturing");
    scheduleMascotBlink();
    scheduleMascotGaze();
    scheduleMascotGesture();
  }

  function setMascotState(state) {
    if (mascot.dataset.mascotState === state) return;
    clearTimeout(mascotEmotionTimer);
    mascotEmotionTimer = null;
    clearTimeout(speechBoundaryTimer);
    speechBoundaryTimer = null;
    mascot.dataset.mascotState = state;
    mascot.dataset.speechBoundaries = "false";
    delete mascot.dataset.mouth;
    updateMascotMotion();
  }

  function restoreMascotState() {
    setMascotState(MASCOT_APP_STATES[document.body.dataset.state] || "idle");
  }

  function showMascotHappyMoment() {
    setMascotState("happy");
    mascot.classList.add("is-gesturing");
    setTimeout(() => mascot.classList.remove("is-gesturing"), 520);
    mascotEmotionTimer = setTimeout(() => {
      if (mascot.dataset.mascotState === "happy") restoreMascotState();
    }, 700);
  }

  if (typeof reducedMotionQuery.addEventListener === "function") {
    reducedMotionQuery.addEventListener("change", updateMascotMotion);
  } else {
    reducedMotionQuery.addListener(updateMascotMotion);
  }
  updateMascotMotion();

  function loadVoices() { voices = window.speechSynthesis.getVoices() || []; }
  if (hasTTS) {
    loadVoices();
    if (typeof window.speechSynthesis.addEventListener === "function") {
      window.speechSynthesis.addEventListener("voiceschanged", loadVoices);
    } else {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }
  }

  const FEMALE_VOICE = /francisca|luciana|maria|camila|bruna|fernanda|joana|female|feminina|woman/i;
  const MALE_VOICE = /(^|[\s_-])(male|masculino|man)([\s_-]|$)/i;

  function waitForVoices() {
    loadVoices();
    if (voices.length) return Promise.resolve(voices);

    return new Promise((resolve) => {
      let settled = false;
      let fallbackHandler = null;
      const previousHandler = window.speechSynthesis.onvoiceschanged;
      const finish = () => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        if (typeof window.speechSynthesis.removeEventListener === "function") {
          window.speechSynthesis.removeEventListener("voiceschanged", finish);
        } else if (window.speechSynthesis.onvoiceschanged === fallbackHandler) {
          window.speechSynthesis.onvoiceschanged = previousHandler || null;
        }
        loadVoices();
        resolve(voices);
      };
      const timer = setTimeout(finish, 1200);
      if (typeof window.speechSynthesis.addEventListener === "function") {
        window.speechSynthesis.addEventListener("voiceschanged", finish);
      } else {
        fallbackHandler = () => {
          if (typeof previousHandler === "function") previousHandler.call(window.speechSynthesis);
          finish();
        };
        window.speechSynthesis.onvoiceschanged = fallbackHandler;
      }
    });
  }

  function pickVoice() {
    const brazilianPortuguese = voices.filter((v) => /^pt[-_]br$/i.test(v.lang));
    const portuguese = brazilianPortuguese.length
      ? brazilianPortuguese
      : voices.filter((v) => /^pt(?:[-_]|$)/i.test(v.lang));
    const score = (v) => {
      let value = FEMALE_VOICE.test(v.name) ? 500 : 0;
      if (MALE_VOICE.test(v.name)) value -= 500;
      if (/natural|neural|online|premium/i.test(v.name)) value += 100;
      if (!v.localService) value += 15;
      if (/google|microsoft/i.test(v.name)) value += 10;
      return value;
    };
    return portuguese.sort((a, b) => score(b) - score(a))[0] || null;
  }

  // Mantém as frases juntas para aproveitar a prosódia natural do navegador.
  function chunkText(text) {
    const parts = text.match(/[^.!?…\n]+[.!?…]*|\n+/g) || [text];
    const out = [];
    let current = "";
    for (const part of parts) {
      const sentence = part.trim();
      if (!sentence) {
        if (current) { out.push(current); current = ""; }
        continue;
      }
      if (sentence.length > 220) {
        if (current) { out.push(current); current = ""; }
        let fragment = "";
        for (const word of sentence.split(/\s+/)) {
          if (fragment && (fragment + " " + word).length > 180) {
            out.push(fragment);
            fragment = word;
          } else {
            fragment += (fragment ? " " : "") + word;
          }
        }
        if (fragment) out.push(fragment);
      } else if (current && (current + " " + sentence).length > 220) {
        out.push(current);
        current = sentence;
      } else {
        current += (current ? " " : "") + sentence;
      }
    }
    if (current) out.push(current);
    return out;
  }

  // "Fala fantasma": precisa rodar dentro de um toque do usuário para liberar o áudio no Android
  function unlockAudio() {
    if (!hasTTS) return;
    try {
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();
      const ghost = new SpeechSynthesisUtterance(".");
      ghost.volume = 0;
      ghost.lang = "pt-BR";
      window.speechSynthesis.speak(ghost);
    } catch (e) {}
  }

  function stopSpeaking() {
    speakToken++;
    clearInterval(keepAlive); clearTimeout(watchdog);
    clearTimeout(speechStartTimer);
    if (mascot.dataset.mascotState === "speaking") setMascotState("idle");
    if (hasTTS) window.speechSynthesis.cancel();
    if (activeSpeechResolve) {
      const resolve = activeSpeechResolve;
      activeSpeechResolve = null;
      resolve();
    }
  }

  // Fala o texto e, ao terminar, volta a escutar
  function speak(text, onStart = null, onComplete = null) {
    return new Promise((resolve) => {
      showStatus("BEA: " + text);
      busy = true;
      stopRecognition();
      stopSpeaking();
      const token = speakToken;

      const done = (endedNaturally = false) => {
        if (token !== speakToken) return;
        clearInterval(keepAlive); clearTimeout(watchdog);
        clearTimeout(speechStartTimer);
        if (activeSpeechResolve === resolve) activeSpeechResolve = null;
        if ($("biaMascot").dataset.mascotState === "speaking") setMascotState("idle");
        resumeListening();
        if (endedNaturally && started && typeof onComplete === "function") onComplete();
        resolve();
      };

      activeSpeechResolve = resolve;
      if (!hasTTS) { speechStartTimer = setTimeout(done, 300); return; }

      setState("speaking", "Falando…");
      const chunks = chunkText(text);
      let i = 0, started = false;

      const next = () => {
        if (token !== speakToken) return;
        if (i >= chunks.length) { done(); return; }
        const u = new SpeechSynthesisUtterance(chunks[i++]);
        u.lang = "pt-BR";
        u.rate = 0.96;
        u.pitch = 1.03;
        u.volume = 1;
        const v = pickVoice();
        if (v) {
          u.voice = v;
        }
        u.onstart = () => {
          started = true;
          setMascotState("speaking");
          if (typeof onStart === "function") onStart();
        };
        u.onboundary = (event) => {
          if (token !== speakToken || (event.name && event.name !== "word") ||
            !Number.isInteger(event.charIndex) || event.charIndex < 0) return;
          const wordStart = chunks[i - 1].slice(event.charIndex).trimStart().charAt(0).toLocaleLowerCase();
          const mouth = /[eéií]/.test(wordStart)
            ? "wide"
            : /[oóuúô]/.test(wordStart)
              ? "round"
              : /[aáãâ]/.test(wordStart)
                ? "open"
                : "closed";
          mascot.dataset.speechBoundaries = "true";
          mascot.dataset.mouth = mouth;
          clearTimeout(speechBoundaryTimer);
          speechBoundaryTimer = setTimeout(() => {
            if (mascot.dataset.mascotState === "speaking") mascot.dataset.mouth = "closed";
          }, Math.min(300, Math.max(110, (event.charLength || 3) * 35)));
        };
        u.onend = () => {
          if (token !== speakToken) return;
          if (i >= chunks.length) {
            done(true);
            return;
          }
          setMascotState("idle");
          const pause = /[,;:]$/.test(chunks[i - 1]) ? 120 : 180;
          speechStartTimer = setTimeout(next, pause);
        };
        u.onerror = (e) => {
          if (token !== speakToken) return;
          setMascotState(e.error === "canceled" || e.error === "interrupted" ? "idle" : "error");
          if (e.error === "canceled" || e.error === "interrupted") { done(); return; }
          next();
        };
        window.speechSynthesis.resume();
        window.speechSynthesis.speak(u);
      };

      waitForVoices().then(() => {
        if (token !== speakToken) return;
        if (!chunks.length) { done(); return; }
        speechStartTimer = setTimeout(next, 100);
        keepAlive = setInterval(() => {
          if (window.speechSynthesis.speaking) window.speechSynthesis.resume();
        }, 5000);
        watchdog = setTimeout(() => {
          if (!started && token === speakToken) {
            window.speechSynthesis.cancel();
            showStatus("BEA: " + text + "\n\n(Sem áudio? Confira o volume de mídia do aparelho.)");
            done();
          }
        }, 8000);
      });
    });
  }

  /* ================= RECONHECIMENTO DE VOZ ================= */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function buildRecognition() {
    recognition = new SR();
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = "pt-BR";

    recognition.onstart = () => {
      recognitionStarting = false;
      recognitionRunning = true;
      if (busy || micMuted || micBlocked) {
        stopRecognition();
        return;
      }
      setState("listening", "Ouvindo… diga “Bia”");
      showStatus("Microfone ativo. Diga “Bia” e faça seu pedido.");
    };

    recognition.onresult = (event) => {
      if (busy || micMuted || micBlocked) return;
      const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
      if (!WAKE_ONE.test(transcript)) return;
      const command = transcript.replace(WAKE_ALL, "").replace(/^[\s,.:;!?-]+/, "").trim();

      if (!command) {
        speak("Estou ouvindo. O que deseja?");
      } else {
        processCommand(command);
      }
    };

    recognition.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        micBlocked = true;
        updateMicButton();
        fail("Microfone bloqueado. Permita o acesso ao microfone nas configurações do navegador e recarregue a página.");
      } else if (e.error === "audio-capture") {
        micBlocked = true;
        updateMicButton();
        fail("Não encontrei nenhum microfone neste aparelho.");
      } else if (e.error === "network") {
        setState("reconnecting", "Reconectando microfone…");
        showStatus("O reconhecimento de voz perdeu a internet. Tentando de novo…");
      }
    };

    recognition.onend = () => {
      recognitionRunning = false;
      recognitionStarting = false;
      scheduleRestart();
    };
  }

  function startRecognition() {
    if (!systemOn || busy || micMuted || micBlocked) return;
    if (!SR) {
      micBlocked = true;
      updateMicButton();
      setState("error", "Sem reconhecimento de voz");
      showStatus("Este navegador não tem reconhecimento de voz. Use um navegador compatível, como o Google Chrome.");
      return;
    }
    if (!recognition) buildRecognition();
    if (recognitionRunning || recognitionStarting) return;
    recognitionStarting = true;
    setState("reconnecting", "Conectando microfone…");
    try {
      recognition.start();
    } catch (error) {
      recognitionStarting = false;
      console.warn("Não foi possível iniciar o reconhecimento de voz.", {
        name: error.name || "Error"
      });
      setState("error", "Microfone indisponível");
      showStatus("Não foi possível iniciar a escuta. Confira a permissão do microfone e tente reativá-lo.");
    }
  }

  // abort() solta o microfone na hora (stop() demora e atrapalha a fala)
  function stopRecognition() {
    clearTimeout(restartTimer);
    recognitionStarting = false;
    if (recognition) { try { recognition.abort(); } catch (e) {} }
  }

  function scheduleRestart() {
    if (!systemOn || busy || micMuted || micBlocked) return;
    clearTimeout(restartTimer);
    setState("reconnecting", "Reconectando microfone…");
    restartTimer = setTimeout(() => {
      if (systemOn && !busy && !micMuted && !micBlocked) startRecognition();
    }, CONFIG.recognitionRestartMs);
  }

  function resumeListening() {
    busy = false;
    if (!systemOn) return;
    if (micMuted) {
      setState("muted", "Microfone silenciado");
      showStatus("Microfone silenciado. Toque em “Reativar microfone” para voltar à escuta.");
      return;
    }
    if (micBlocked) {
      setState("error", "Microfone indisponível");
      return;
    }
    setState("reconnecting", "Conectando microfone…");
    startRecognition();
  }

  // Erro: vibra, mostra em vermelho e avisa por voz
  function fail(message) {
    buzz([120, 80, 120]);
    setState("error", "Atenção");
    return speak(message);
  }

  /* ================= CÂMERA ================= */
  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStatus("Câmera indisponível: abra esta página por HTTPS ou localhost.");
      return false;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      stream.getVideoTracks().forEach((track) => {
        track.addEventListener("ended", () => {
          clearEnvironmentScan();
          stream = null;
          video.srcObject = null;
          showStatus("A câmera foi desconectada. Reconecte-a e recarregue a página para retomar a leitura automática.");
        }, { once: true });
      });
      video.srcObject = stream;
      await video.play();
      return true;
    } catch (e) {
      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
        stream = null;
        video.srcObject = null;
      }
      const msgs = {
        NotAllowedError: "A câmera foi bloqueada. Permita o acesso à câmera e recarregue a página.",
        NotFoundError: "Não encontrei nenhuma câmera neste aparelho.",
        NotReadableError: "A câmera está sendo usada por outro aplicativo. Feche-o e tente de novo."
      };
      showStatus("Erro na câmera: " + (msgs[e.name] || e.message));
      return false;
    }
  }

  // Foto reduzida: mantém boa qualidade sem pesar na rede
  function takePhoto() {
    if (!stream || !video.videoWidth) return null;
    const vw = video.videoWidth, vh = video.videoHeight;
    const scale = Math.min(1, CONFIG.imageMaxSide / Math.max(vw, vh));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(vw * scale);
    canvas.height = Math.round(vh * scale);
    const context = canvas.getContext("2d");
    if (!context) return null;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg", CONFIG.imageQuality);
  }

  function clearEnvironmentScan() {
    clearTimeout(environmentScanTimer);
    environmentScanTimer = null;
  }

  function scheduleEnvironmentScan(delay = CONFIG.environmentScanIntervalMs) {
    clearEnvironmentScan();
    if (!systemOn || !stream || document.visibilityState !== "visible") return;

    environmentScanTimer = setTimeout(async () => {
      environmentScanTimer = null;
      if (!systemOn || !stream || document.visibilityState !== "visible") return;
      if (busy) {
        scheduleEnvironmentScan(10000);
        return;
      }
      try {
        await processCommand(
          "Descreva brevemente o ambiente visível à minha frente.",
          true,
          true
        );
      } finally {
        scheduleEnvironmentScan();
      }
    }, delay);
  }

  /* ================= API (lógica original) ================= */
  async function processCommand(question, requireImage = false, automatic = false) {
    if (busy) return;
    const requestId = createRequestId();
    busy = true;
    stopRecognition();
    buzz(60);
    setState("thinking", "Pensando…");
    showStatus("Preparando a solicitação… Pergunta: “" + question + "”");

    let photo;
    const captureStartedAt = performance.now();
    setMascotState("observing");
    try {
      photo = takePhoto();
    } catch {
      photo = null;
    } finally {
      setMascotState("thinking");
    }
    if (photo) setMascotState("observing");
    console.info("[B.E.A. performance]", {
      request_id: requestId,
      stage: "capture_prepare",
      duration_ms: Number((performance.now() - captureStartedAt).toFixed(2))
    });
    if (!photo && requireImage) {
      if (automatic) {
        setState("error", "Câmera indisponível");
        showStatus("Não consegui capturar a imagem para a leitura automática. Confira a câmera.");
        resumeListening();
      } else {
        await fail("Não consegui capturar uma imagem. Verifique a câmera e tente novamente.");
      }
      return;
    }
    if (!photo) {
      showStatus("Enviando pergunta sem imagem… Pergunta: “" + question + "”");
    } else {
      showStatus("Analisando a imagem… Pergunta: “" + question + "”");
    }

    if (!navigator.onLine) {
      if (automatic) {
        setState("error", "Sem conexão");
        showStatus("Leitura automática pausada: confira a conexão com a internet.");
        resumeListening();
      } else {
        await fail("Estou sem internet. Verifique a conexão do celular.");
      }
      return;
    }

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), CONFIG.apiTimeoutMs);
    const requestStartedAt = performance.now();
    let responseStatus = null;
    let serverRequestId = null;
    let responseArrivedAt = null;
    let apiRoundTripLogged = false;
    const logApiRoundTrip = () => {
      if (apiRoundTripLogged) return;
      apiRoundTripLogged = true;
      console.info("[B.E.A. performance]", {
        request_id: requestId,
        server_request_id: serverRequestId,
        stage: "api_round_trip",
        status: responseStatus,
        duration_ms: Number((performance.now() - requestStartedAt).toFixed(2))
      });
    };

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        signal: controller.signal,
        headers: {
          "Content-Type": "application/json",
          "X-Request-ID": requestId
        },
        body: JSON.stringify({
          messages: [
            { role: "system", content: SYSTEM_PROMPT },
            {
              role: "user",
              content: [
                { type: "text", text: question },
                ...(photo ? [{ type: "image_url", image_url: { url: photo } }] : [])
              ]
            }
          ]
        })
      });

      responseStatus = response.status;
      serverRequestId = response.headers.get("X-Request-ID");
      const responseText = await response.text();
      responseArrivedAt = performance.now();
      logApiRoundTrip();
      let data;
      try {
        data = JSON.parse(responseText);
      } catch {
        const error = new Error("O servidor respondeu em um formato inesperado.");
        error.status = response.status;
        error.code = "invalid_server_response";
        throw error;
      }
      if (!response.ok) {
        const error = new Error(
          typeof data.error === "string" ? data.error : "O servidor recusou a solicitação."
        );
        error.status = response.status;
        error.code = typeof data.code === "string" ? data.code : "http_error";
        throw error;
      }

      const answer = data && data.choices && data.choices[0] &&
        data.choices[0].message && data.choices[0].message.content;
      if (typeof answer !== "string" || !answer.trim()) {
        const error = new Error("A resposta do servidor não contém texto.");
        error.status = response.status;
        error.code = "invalid_server_response";
        throw error;
      }
      let voiceStartObserved = false;
      buzz([40, 40, 40]);
      await speak(answer, () => {
        if (voiceStartObserved) return;
        voiceStartObserved = true;
        console.info("[B.E.A. performance]", {
          request_id: requestId,
          server_request_id: serverRequestId,
          stage: "response_to_voice_start",
          duration_ms: Number((performance.now() - responseArrivedAt).toFixed(2))
        });
      }, showMascotHappyMoment);
      if (!voiceStartObserved) {
        console.info("[B.E.A. performance]", {
          request_id: requestId,
          server_request_id: serverRequestId,
          stage: "response_to_voice_start",
          duration_ms: null,
          observed: false
        });
      }

    } catch (error) {
      const code = error.code || "network_error";
      console.warn("Falha na solicitação B.E.A.", {
        status: error.status || null,
        code,
        name: error.name || "Error"
      });
      let msg = "Ocorreu um erro inesperado. Tente novamente.";
      if (error.name === "AbortError") msg = "A solicitação demorou demais. Tente novamente.";
      else if (error instanceof TypeError) msg = "Não consegui alcançar o servidor da B.E.A. Verifique se o site está disponível e tente novamente.";
      else if (code === "api_key_missing") msg = "A integração de IA não está configurada no servidor.";
      else if (code === "model_configuration_error") msg = "O modelo de IA não está configurado corretamente no servidor.";
      else if (code === "provider_authentication") msg = "A OpenRouter recusou a credencial configurada. O administrador precisa conferir a chave no Render.";
      else if (code === "provider_credits") msg = "A conta da OpenRouter está sem créditos disponíveis.";
      else if (code === "provider_model_not_found") msg = "O modelo configurado não foi encontrado na OpenRouter. O administrador precisa conferir OPENROUTER_MODEL no Render.";
      else if (code === "provider_rate_limited" || code === "request_rate_limited") msg = error.message;
      else if (code === "provider_timeout" || code === "provider_unavailable") msg = error.message;
      else if (code === "provider_request_rejected" || code === "provider_unsupported_input") msg = error.message;
      else if (code === "provider_invalid_response" || code === "provider_empty_response" ||
        code === "provider_no_answer" || code === "provider_incomplete_response" ||
        code === "provider_content_filtered") msg = error.message;
      else if (code === "request_too_large") msg = error.message;
      else if (code === "invalid_request" || code === "invalid_json" || code === "invalid_content_type") msg = error.message;
      else if (code === "invalid_server_response") msg = "O servidor respondeu em um formato inesperado. Tente novamente mais tarde.";
      else if (error.status >= 500) msg = "O servidor da B.E.A. está com um problema temporário. Tente novamente mais tarde.";
      else if (error.status) msg = error.message;
      if (automatic) {
        setState("error", "Falha na leitura");
        showStatus("Não consegui concluir a leitura automática. " + msg);
        resumeListening();
      } else {
        await fail(msg);
      }
    } finally {
      clearTimeout(timeout);
      logApiRoundTrip();
    }
  }

  /* ================= TELA SEMPRE LIGADA ================= */
  async function keepAwake() {
    try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => {
    updateMascotMotion();
    if (document.visibilityState === "visible" && systemOn) {
      keepAwake();
      if (stream && !environmentScanTimer) scheduleEnvironmentScan();
    } else {
      clearEnvironmentScan();
    }
  });
  window.addEventListener("pagehide", () => {
    systemOn = false;
    clearTimeout(restartTimer);
    clearEnvironmentScan();
    clearTimeout(mascotBlinkTimer);
    clearTimeout(mascotGazeTimer);
    clearTimeout(mascotGestureTimer);
    clearTimeout(mascotEmotionTimer);
    clearTimeout(speechBoundaryTimer);
    mascot.classList.remove("is-gesturing");
    if (recognition) {
      try { recognition.abort(); } catch (e) {}
    }
    recognitionRunning = false;
    recognitionStarting = false;
    if (stream) stream.getTracks().forEach((track) => track.stop());
    video.srcObject = null;
    stopSpeaking();
  });

  /* ================= BOTÕES ================= */
  startBtn.addEventListener("click", async () => {
    startBtn.disabled = true;
    unlockAudio(); // precisa acontecer dentro do toque do usuário
    setState("thinking", "Ativando…");
    showStatus("Ativando câmera e microfone. Aceite as permissões se o celular pedir.");
    systemOn = true;

    const cameraOk = await startCamera();
    keepAwake();

    startBtn.hidden = true;
    muteMicBtn.hidden = false;
    updateMicButton();
    hint.hidden = false;

    if (cameraOk) {
      await speak("Olá! Sou a Bia. Já estou ouvindo. Diga 'Bia' e faça seu pedido.");
    } else {
      await speak("Olá! Sou a Bia e já estou ouvindo. Estou sem câmera; a leitura automática do ambiente não está disponível.");
    }
    if (cameraOk) scheduleEnvironmentScan(CONFIG.firstEnvironmentScanMs);
  });

  muteMicBtn.addEventListener("click", () => {
    if (!systemOn) return;
    micMuted = !micMuted;
    updateMicButton();
    if (micMuted) {
      stopRecognition();
      if (!busy) setState("muted", "Microfone silenciado");
      showStatus("Microfone silenciado. A Bia não ouvirá comandos até você reativá-lo.");
      return;
    }
    showStatus(busy
      ? "Microfone reativado. A escuta retornará quando a Bia terminar de responder."
      : "Microfone reativado. Diga “Bia” e faça seu pedido.");
    if (!busy) resumeListening();
  });
})();
</script>
